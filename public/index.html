    // Lobby state changes slowly; a crowded lobby does not need 60 pushes a
    // second from everyone. State changes push immediately via `force`.
    var now = performance.now();
    if (!force && now - lastLobbyPush < (minMs || 250)) return;
    lastLobbyPush = now;
    // While quick-matching we keep advertising "seek" right through joining the
    // room, and name the room we went to — otherwise the partner, who is still
    // deciding, sees us turn busy and never pairs.
    var stillSeeking = S.phase === 'seeking' || (S.phase === 'waiting' && S.quick);
    S.lobby.setPresence({
      v: 1, n: S.handle.slice(0, 24),
      st: stillSeeking ? 'seek'
        : (S.phase === 'spectating' ? 'watch'
          : (S.phase === 'matched' || S.phase === 'waiting' ? 'busy' : 'idle')),
      m: S.phase === 'matched' ? 1 : null,      // in a bout right now
      hr: S.phase === 'matched' ? S.myHero : null,
      // the room we are in, so anyone in the lobby can come and watch
      rm: S.roomName || (S.quick ? S.seekRoom : S.code) || null,
      t: Date.now()
    });
  }

  function lobbyPlayers() {
    if (!S.lobby) return [];
    var list = S.lobby.peers().filter(function (p) { return !p.isMe && p.pr && p.pr.v; });
    // people you can actually challenge float to the top
    var rank = function (p) { return p.pr.m ? 2 : (p.pr.st === 'seek' ? 0 : 1); };
    list.sort(function (a, b) {
      var d = rank(a) - rank(b);
      if (d) return d;
      return String(a.pr.n || '') < String(b.pr.n || '') ? -1 : 1;
    });
    return list;
  }

  /** Headcount for the lobby screen, across everyone here including you. */
  function lobbyStats() {
    var all = S.lobby ? S.lobby.peers().filter(function (p) { return p.pr && p.pr.v; }) : [];
    var seeking = 0, inMatch = 0;
    for (var i = 0; i < all.length; i++) {
      if (all[i].pr.m) inMatch++;
      else if (all[i].pr.st === 'seek') seeking++;
    }
    return {
      total: all.length,
      seeking: seeking,
      inMatch: inMatch,
      matches: Math.ceil(inMatch / 2)      // players in a bout always come in pairs
    };
  }

  /* ---------------------------------------------------------- match join */
  function enterRoom(name, note) {
    if (!S.lobby) return;
    S.note = note || 'CONNECTING…';
    var target = name;
    S.lobby.join(name).then(function (r) {
      if (S.roomName !== target) { /* superseded */ }
      S.room = r;
      S.roomName = target;
      S.phase = 'waiting';
      S.role = ''; S.oppId = '';
      S.myReady = false; S.oppReady = false; S.started = false;
      S.rematch = 0; S.oppRematch = 0;
      snap = null; pending = null; evBuf = []; seenEv = 0; evId = 0;
      seq = 0; ackSeq = 0;
      resetInput();
      S.note = 'WAITING FOR A CHALLENGER…';
      // say "player here" at once — the opponent scan looks for this, and it
      // lands long before the character select starts pushing full state
      r.setPresence({ pl: 1, v: 1, n: S.handle.slice(0, 24) });
      pushLobby(true);
    }).catch(function (e) {
      // Named rooms can be refused for a viewer. The lobby channel is open to
      // everyone who is here, so run the match there instead, tagged so only
      // the two paired players read each other.
      S.room = lobbyProxy(target);
      S.roomName = target;
      S.phase = 'waiting';
      S.role = ''; S.oppId = '';
      S.myReady = false; S.oppReady = false; S.started = false;
      S.rematch = 0; S.oppRematch = 0;
      snap = null; pending = null; evBuf = []; seenEv = 0; evId = 0;
      seq = 0; ackSeq = 0;
      resetInput();
      S.note = 'WAITING FOR A CHALLENGER…';
      S.room.setPresence({ pl: 1, v: 1, n: S.handle.slice(0, 24) });
    });
  }

  /** A match channel built on the lobby, for viewers who cannot open a named
   *  room. Everyone here receives it; only the tagged pair reads it. */
  function lobbyProxy(name) {
    return {
      kind: 'proxy',
      setPresence: function (o) {
        var copy = { rmk: name };
        for (var k in o) copy[k] = o[k];
        return S.lobby.setPresence(copy);
      },
      peers: function () {
        return S.lobby.peers().filter(function (p) {
          return p.isMe || (p.pr && p.pr.rmk === name);
        });
      },
      onPeers: function (cb) { return S.lobby.onPeers(cb); },
      connected: function () { return S.lobby.connected(); },
      leave: function () {
        return S.lobby.setPresence({
          rmk: null, r: null, a: null, b: null, ev: null, an: null,
          h1: null, h2: null, go: null, sq: null, c: null
        });
      }
    };
  }

  function resetInput() {
    sentAt = {};
    inCounters = { j: 0, h: 0, b: 0, s: 0, dl: 0, dr: 0 };
    inSeen = { j: 0, h: 0, b: 0, s: 0, dl: 0, dr: 0 };
    inQueue = { j: 0, h: 0, b: 0, s: 0, dl: 0, dr: 0 };
    guestHold = { lr: 0, bl: 0, dk: 0 };
    hostDelay = [];
  }

  function leaveMatch(note) {
    if (S.room) { S.room.leave(); S.room = null; }
    S.roomName = '';
    S.phase = 'lobby'; S.code = ''; S.role = ''; S.oppId = ''; S.oppHandle = '';
    S.quick = false; S.seekRoom = '';
    S.started = false; S.myReady = false; S.oppReady = false;
    snap = null; pending = null;
    resetInput();
    S.note = note || '';
    pushLobby(true);
  }

  /* ---------------------------------------------- room bookkeeping / tick */
  function roomPeers() {
    try { return (S.room && S.room.peers) ? S.room.peers() : []; } catch (e) { return []; }
  }

  function tickLobby() {
    if (!S.lobby) return;
    if (S.phase === 'seeking') {
      // deterministic pairing: sort everyone who is looking, pair them off
      var seeking = S.lobby.peers().filter(function (p) {
        return p.pr && p.pr.v && (p.isMe ? true : p.pr.st === 'seek');
      });
      seeking = seeking.filter(function (p) { return p.isMe ? true : p.pr.st === 'seek'; });
      seeking.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
      var idx = -1;
      for (var i = 0; i < seeking.length; i++) if (seeking[i].isMe) idx = i;
      if (idx >= 0) {
        var partner = (idx % 2 === 0) ? seeking[idx + 1] : seeking[idx - 1];
        if (partner) {
          var a = seeking[idx].id, b = partner.id;
          // if they already picked a room, go to theirs; otherwise both sides
          // compute the same name from the lower peer id
          var advertised = (partner.pr && typeof partner.pr.rm === 'string' && partner.pr.rm.charAt(0) === 'q')
            ? partner.pr.rm : '';
          var name = advertised || ('q' + roomKey(a < b ? a : b));
          S.seekRoom = name;
          S.code = '';
          enterRoom(name, 'MATCH FOUND');
        }
      }
    }
  }

  function tickRoom(dt) {
    if (!S.room) return;
    var ps = roomPeers();
    var me = null, opp = null, maybe = null;
    for (var i = 0; i < ps.length; i++) {
      // a room can also hold spectators; mistaking one for the opponent would
      // stall the bout, so prefer a peer flying the player flag and never
      // fall back to one that has announced itself as a watcher
      var pr = ps[i].pr;
      if (ps[i].isMe && (ps[i].sameTab || !me)) me = ps[i];
      else if (ps[i].isMe) continue;
      else if (pr && pr.pl) { if (!opp) opp = ps[i]; }
      else if (!(pr && pr.sp) && !maybe) maybe = ps[i];
    }
    if (!opp) opp = maybe;
    // "me" can also match another tab of mine — prefer this exact document
    for (var j = 0; j < ps.length; j++) if (ps[j].sameTab) me = ps[j];
    if (me) S.myId = me.id;

    /* ---- watching someone else's bout: read the host, send nothing ---- */
    if (S.role === 'spectator') {
      var host = null, players = [];
      for (var k = 0; k < ps.length; k++) {
        var pk = ps[k];
        if (pk.isMe || !pk.pr) continue;
        if (pk.pr.pl) players.push(pk);
        if (pk.pr.r === 'h') host = pk;
      }
      S.watching = players.map(function (p) { return String(p.pr.n || 'FIGHTER').slice(0, 16); });
      pushSpectator();
      if (!host) return;                       // caller times out on snapshotAge
      var hp = host.pr;
      if (hp.sq !== undefined && (!snap || hp.sq >= snap.sq)) {
        var freshS = !snap || hp.sq > snap.sq;
        snap = hp;
        if (freshS) { S.lastSnapAt = performance.now(); pending = hp; }
      }
      S.started = !!hp.go;
      S.oppEpoch = hp.ep | 0;
      S.heroes = (hp.h1 && hp.h2) ? [hp.h1, hp.h2] : null;
      return;
    }

    if (!opp) {
      if (S.phase === 'matched') {
        // A socket that reconnects, or a peer that re-registers under a new
        // id, makes the opponent vanish for a moment. Ending the bout on the
        // first missing frame would drop people mid-fight over a blip, so
        // give them a few seconds to come back.
        S.oppGoneFor = (S.oppGoneFor || 0) + dt;
        if (S.oppGoneFor > 5) leaveMatch('OPPONENT LEFT THE RING');
        else S.note = 'RECONNECTING…';
      } else {
        S.note = S.code ? ('ROOM ' + S.code + ' — WAITING FOR A CHALLENGER…') : 'WAITING FOR A CHALLENGER…';
      }
      return;
    }
    S.oppGoneFor = 0;

    S.oppId = opp.id;
    S.oppHandle = (opp.pr && typeof opp.pr.n === 'string') ? String(opp.pr.n).slice(0, 24) : 'CHALLENGER';
    // Decide who simulates ONCE per room. Peer ids change when a socket
    // reconnects, and recomputing could swap the roles mid-fight — leaving
    // two hosts, or none.
    if (!S.role) S.role = (S.myId < opp.id) ? 'host' : 'guest';
    S.watchers = 0;
    for (var w = 0; w < ps.length; w++) if (!ps[w].isMe && ps[w].pr && ps[w].pr.sp) S.watchers++;
    if (S.phase === 'waiting') { S.phase = 'matched'; S.note = ''; S.quick = false; pushLobby(true); }

    var op = opp.pr || {};
    if (typeof op.hero === 'number') S.oppHero = Math.max(0, Math.min(ROSTER.length - 1, op.hero | 0));
    S.oppReady = !!op.rdy;
    S.oppRematch = op.rm | 0;

    if (S.role === 'guest') {
      if (op.r === 'h' && op.sq !== undefined) {
        if (!snap || op.sq >= snap.sq) {
          var fresh = !snap || op.sq > snap.sq;
          snap = op;
          if (fresh) { S.lastSnapAt = performance.now(); pending = op; }
        }
        // Round-trip measured on OUR clock: the host echoes the sequence
        // number we sent, and we timed that one ourselves. (Subtracting the
        // host's own timestamp would be comparing two unrelated clocks.)
        if (op.ack && sentAt[op.ack]) {
          S.ping = Math.max(0, Math.round(performance.now() - sentAt[op.ack]));
          delete sentAt[op.ack];
        }
        S.started = !!op.go;
        S.oppEpoch = op.ep | 0;
        S.heroes = (op.h1 && op.h2) ? [op.h1, op.h2] : null;
      }
    } else {
      if (op.r === 'g') {
        S.lastInAt = performance.now();
        guestHold.lr = op.lr | 0; guestHold.bl = op.bl | 0; guestHold.dk = op.dk | 0;
        var c = op.c || [];
        var keys = ['j', 'h', 'b', 's', 'dl', 'dr'];
        for (var k = 0; k < keys.length; k++) {
          var v = c[k] | 0, key = keys[k];
          if (v > inSeen[key]) { inQueue[key] = Math.min(3, inQueue[key] + (v - inSeen[key])); inSeen[key] = v; }
          else if (v < inSeen[key]) { inSeen[key] = v; }         // peer restarted its counters
        }
        if (op.sq !== undefined) ackSeq = op.sq;
        if (op.ats) S.ping = Math.max(0, Math.round(performance.now() - (op.ats || 0)));
      }
    }
  }

  /* ------------------------------------------------------------- pushing */
  function pushRoom(obj) {
    if (!S.room) return;
    var now = performance.now();
    if (now - lastPushed < 32) return;                 // ~30 Hz, the presence budget
    lastPushed = now;
    S.room.setPresence(obj);
  }

  function pushHost(G) {
    var f1 = G.f1, f2 = G.f2;
    var o = {
      r: 'h', v: 1, n: S.handle.slice(0, 24), hero: S.myHero, rdy: S.myReady ? 1 : 0, rm: S.rematch,
      pl: 1,
      sq: ++seq, ats: Math.round(performance.now()), ack: ackSeq, go: S.started ? 1 : 0, ep: S.epoch
    };
    if (S.started && f1 && f2) {
      o.h1 = f1.def.id; o.h2 = f2.def.id;
      o.a = encFighter(f1); o.b = encFighter(f2);
      o.ph = Math.max(0, PH.indexOf(G.phase));
      o.ck = Math.round(G.clock * 10);
      o.rd = G.round; o.w = [f1.wins, f2.wins];
      o.ct = Math.round((G.countT || 0) * 10);
      o.dw = G.downed ? (G.downed === f1 ? 1 : 2) : 0;
      o.sc = G.scene === 'result' ? 1 : 0;
      o.mw = G.matchWinner ? (G.matchWinner === f1 ? 1 : 2) : 0;
      if (G.annT > 0) o.an = [String(G.ann).slice(0, 24), Math.round(G.annT * 10), G.annCol];
      if (evBuf.length) o.ev = evBuf.slice(-5);
    }
    pushRoom(o);
  }

  function pushGuest() {
    var o = {
      r: 'g', v: 1, pl: 1, n: S.handle.slice(0, 24), hero: S.myHero, rdy: S.myReady ? 1 : 0, rm: S.rematch,
      sq: ++seq, ats: snap && snap.ats ? snap.ats : 0,   // echo the host's stamp back for ITS measurement
      lr: guestHold.lr, bl: guestHold.bl, dk: guestHold.dk,
      c: [inCounters.j, inCounters.h, inCounters.b, inCounters.s, inCounters.dl, inCounters.dr]
    };
    sentAt[o.sq] = performance.now();
    if (o.sq % 64 === 0) {                       // keep the map from growing
      for (var k in sentAt) if (o.sq - k > 128) delete sentAt[k];
    }
    pushRoom(o);
  }

  /** A watcher announces itself so the fighters can see a crowd, and so the
   *  players' own peer scan never mistakes it for an opponent. */
  function pushSpectator() {
    if (!S.room) return;
    var now = performance.now();
    if (now - lastPushed < 500) return;        // watchers are cheap company
    lastPushed = now;
    S.room.setPresence({ sp: 1, v: 1, n: S.handle.slice(0, 24), t: Date.now() });
  }

  /** Bouts running right now, grouped by the room they are in. */
  function liveMatches() {
    if (!S.lobby) return [];
    var all = S.lobby.peers().filter(function (p) { return p.pr && p.pr.v && p.pr.m && p.pr.rm; });
    var map = {}, order = [];
    for (var i = 0; i < all.length; i++) {
      var pr = all[i].pr, key = String(pr.rm);
      if (!map[key]) { map[key] = { room: key, names: [], heroes: [] }; order.push(key); }
      if (map[key].names.length < 2) {
        map[key].names.push(String(pr.n || 'FIGHTER').slice(0, 16));
        map[key].heroes.push(Math.max(0, Math.min(ROSTER.length - 1, pr.hr | 0)));
      }
    }
    return order.map(function (k) { return map[k]; });
  }

  /* ----------------------------------------------------- host: FX events */
  function event(kind, x, y, w) {
    if (S.role !== 'host' || !S.started) return;
    evBuf.push([++evId, kind, Math.round(x), Math.round(y), Math.round((w || 0) * 100)]);
    if (evBuf.length > 5) evBuf.shift();
  }

  /* ------------------------------------- guest: apply what the host sent */
  function applySnapshot(G) {
    if (!pending) return;
    var s = pending; pending = null;
    if (!s.a || !s.b || !G.f1 || !G.f2) return;

    decFighter(G.f1, s.a, G.f2, s);
    decFighter(G.f2, s.b, G.f1, s);
    G.f1.wins = (s.w && s.w[0]) | 0; G.f2.wins = (s.w && s.w[1]) | 0;
    G.phase = PH[s.ph] || 'fight';
    G.clock = (s.ck | 0) / 10;
    G.round = s.rd | 0;
    G.countT = (s.ct | 0) / 10;
    G.downed = s.dw === 1 ? G.f1 : (s.dw === 2 ? G.f2 : null);
    G.matchWinner = s.mw === 1 ? G.f1 : (s.mw === 2 ? G.f2 : null);
    if (s.an) { G.ann = s.an[0]; G.annT = (s.an[1] | 0) / 10; G.annDur = Math.max(0.3, G.annT); G.annCol = s.an[2] || '#fff'; }

    // one-shot moments, played once each
    if (s.ev) {
      for (var i = 0; i < s.ev.length; i++) {
        var e = s.ev[i];
        if (e[0] <= seenEv) continue;
        seenEv = e[0];
        playEvent(e[1], e[2], e[3], e[4] / 100);
      }
    }
    if (s.sc === 1 && G.scene === 'fight') {
      G.scene = 'result'; G.resultT = 0; G.annT = 0; FX.clear();
      SFX.music('menu'); SFX.cheer(1.2);
    }
  }

  function playEvent(kind, x, y, w) {
    switch (kind) {
      case 0: SFX.hit(w); FX.spark(x, y, w, '#fff0a8'); GameShake(5 + w * 20); break;
      case 1: SFX.block(); FX.spark(x, y, 0.25, '#cfe3ff'); GameShake(4); break;
      case 2: SFX.parry(); FX.spark(x, y, 0.6, '#9fe8ff'); FX.popup(x, y - 40, 'PARRY!', '#9fe8ff', 30); break;
      case 3: SFX.superHit(); FX.popup(x, y - 50, 'GUARD BREAK!', '#ff9b4a', 28); GameShake(18); break;
      case 4: SFX.charge(); GameShake(10); break;
      case 5: SFX.bell(1); break;
      case 6: SFX.whiff(); break;
      case 7: SFX.ko(); GameShake(30); break;
      case 8: SFX.pop(); break;
    }
  }
  function GameShake(a) { if (window.G && G.shake) G.shake(a); }

  /* ------------------------------------------- host: read guest's inputs */
  function guestInput(into) {
    into.left = guestHold.lr < 0; into.right = guestHold.lr > 0;
    into.block = !!guestHold.bl; into.duck = !!guestHold.dk;
    into.jab = take('j'); into.hook = take('h'); into.body = take('b'); into.special = take('s');
    into.dash = take('dl') ? -1 : (take('dr') ? 1 : 0);
    return into;
  }
  function take(k) { if (inQueue[k] > 0) { inQueue[k]--; return true; } return false; }

  /* ------------------------------ guest: record my own input for sending */
  function recordInput(i) {
    guestHold.lr = (i.right ? 1 : 0) - (i.left ? 1 : 0);
    guestHold.bl = i.block ? 1 : 0;
    guestHold.dk = i.duck ? 1 : 0;
    if (i.jab) inCounters.j++;
    if (i.hook) inCounters.h++;
    if (i.body) inCounters.b++;
    if (i.special) inCounters.s++;
    if (i.dash < 0) inCounters.dl++;
    if (i.dash > 0) inCounters.dr++;
  }

  /* ------------------ host: hold its own input back to match guest's lag */
  function delayHostInput(i, dt) {
    var lag = Math.min(0.16, Math.max(0.03, (S.ping || 90) / 2000));
    hostDelay.push({ t: performance.now(), i: { left: i.left, right: i.right, block: i.block, duck: i.duck, jab: i.jab, hook: i.hook, body: i.body, special: i.special, dash: i.dash } });
    var cutoff = performance.now() - lag * 1000;
    var out = null;
    while (hostDelay.length && hostDelay[0].t <= cutoff) out = hostDelay.shift().i;
    if (hostDelay.length > 40) hostDelay.splice(0, hostDelay.length - 40);
    if (!out) return { left: false, right: false, block: i.block, duck: i.duck, jab: false, hook: false, body: false, special: false, dash: 0 };
    return out;
  }

  /* ---------------------------------------------------------------- API  */
  return {
    S: S,
    init: init,
    ready: function () { return S.ready; },
    online: function () { return S.phase === 'matched' || S.phase === 'spectating'; },
    isSpectator: function () { return S.role === 'spectator'; },
    watchers: function () { return S.watchers | 0; },
    watching: function () { return S.watching || []; },
    liveMatches: liveMatches,
    spectate: function (roomName) {
      if (!S.lobby || !roomName) return;
      S.role = 'spectator';
      S.phase = 'spectating';
      S.code = ''; S.quick = false; S.seekRoom = '';
      snap = null; pending = null; seenEv = 0;
      S.started = false; S.heroes = null; S.oppEpoch = -1; S.lastSnapAt = performance.now();
      S.note = 'JOINING THE CROWD…';
      S.lobby.join(roomName).then(function (r) {
        S.room = r; S.roomName = roomName; S.note = '';
        pushSpectator();
      }).catch(function () {
        // a viewer who cannot open that room simply cannot watch it
        S.room = lobbyProxy(roomName); S.roomName = roomName; S.note = '';
      });
    },
    kindLabel: function () {
      return S.kind === 'room' ? 'ONLINE'
        : S.kind === 'relay' ? 'ONLINE'
        : S.kind === 'p2p' ? 'ONLINE — BACKUP NETWORK'
        : S.kind === 'local' ? 'THIS BROWSER ONLY' : 'OFFLINE';
    },
    handle: function () { return S.handle; },
    reroll: function () { S.handle = randomHandle(); pushLobby(true); },
    lobbyPlayers: lobbyPlayers,
    lobbyStats: lobbyStats,

    enterLobby: function () { init(); if (S.phase === 'off') S.phase = 'lobby'; pushLobby(); },
    seek: function () { S.phase = 'seeking'; S.quick = true; S.code = ''; S.seekRoom = ''; S.note = 'LOOKING FOR AN OPPONENT…'; pushLobby(true); },
    stopSeek: function () { S.phase = 'lobby'; S.quick = false; S.seekRoom = ''; S.note = ''; pushLobby(true); },
    createRoom: function () { S.quick = false; S.seekRoom = ''; S.code = randomCode(); enterRoom('c' + roomKey(S.code), 'ROOM ' + S.code); },
    joinCode: function (code) { S.quick = false; S.seekRoom = ''; S.code = String(code).toUpperCase().slice(0, 4); enterRoom('c' + roomKey(S.code), 'JOINING ' + S.code); },
    leaveMatch: leaveMatch,

    setHero: function (i) { S.myHero = i; },
    setReady: function (v) { S.myReady = !!v; },
    requestRematch: function () { S.rematch++; },
    clearRematch: function () { S.rematch = 0; S.oppRematch = 0; },
    wantsRematch: function () { return S.rematch > 0; },
    oppWantsRematch: function () { return S.oppRematch > 0; },
    oppHandle: function () { return S.oppHandle || 'CHALLENGER'; },
    bothReady: function () { return S.myReady && S.oppReady; },
    bothRematch: function () { return S.rematch > 0 && S.oppRematch > 0; },
    markStarted: function (v) {
      S.started = !!v;
      if (v) { S.epoch++; S.rematch = 0; S.oppRematch = 0; }
      else { S.myReady = false; S.oppReady = false; }
    },
    epoch: function () { return S.epoch; },
    oppEpoch: function () { return S.oppEpoch; },
    heroes: function () { return S.heroes; },
    hasSnapshot: function () { return !!snap; },

    isHost: function () { return S.role === 'host'; },
    role: function () { return S.role; },
    oppHero: function () { return S.oppHero; },
    ping: function () { return S.ping; },
    note: function () { return S.note; },

    tick: function (dt, G) {
      if (!S.ready) return;
      tickLobby();
      tickRoom(dt);
      if (S.phase === 'off' || S.phase === 'lobby' || S.phase === 'seeking') pushLobby();
      // keep the watch list honest about who is fighting whom, cheaply
      else if (S.phase === 'matched' || S.phase === 'spectating') pushLobby(false, 2000);
    },
    pushHost: pushHost,
    pushGuest: pushGuest,
    applySnapshot: applySnapshot,
    guestInput: guestInput,
    recordInput: recordInput,
    delayHostInput: delayHostInput,
    event: event,

/* =========================================================================
   RIPPLE RUMBLE — arena art, particle FX, HUD
   ========================================================================= */
var W = 1280, H = 720;
var FONT_BIG = '"Arial Black", "Haettenschweiler", Impact, sans-serif';
var FONT_UI = '"Trebuchet MS", "Segoe UI", sans-serif';

function txt(ctx, s, x, y, size, col, align, outlineCol, outlineW, font) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + (font || FONT_BIG);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outlineCol) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = outlineW || Math.max(3, size * 0.14);
    ctx.strokeStyle = outlineCol;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = col;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================ particles */
var FX = {
  list: [],
  clear: function () { this.list.length = 0; },
  add: function (o) { this.list.push(o); return o; },

  spark: function (x, y, power, col) {
    var n = 6 + Math.round(power * 16);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 420 * (0.4 + power);
      this.add({
        t: 'spark', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        life: 0.25 + Math.random() * 0.4, age: 0, col: col || '#ffe58a', r: 2 + Math.random() * 3 * power
      });
    }
    this.add({ t: 'impact', x: x, y: y, life: 0.22, age: 0, r: 20 + power * 46, col: col || '#fff' });
  },
  sweat: function (x, y, dir) {
    for (var i = 0; i < 4; i++) {
      this.add({
        t: 'sweat', x: x, y: y, vx: dir * (60 + Math.random() * 200), vy: -120 - Math.random() * 160,
        life: 0.6, age: 0, r: 3 + Math.random() * 3
      });
    }
  },
  dust: function (x, y, dir) {
    for (var i = 0; i < 8; i++) {
      this.add({
        t: 'dust', x: x + (Math.random() - 0.5) * 30, y: y, vx: dir * (30 + Math.random() * 130),
        vy: -20 - Math.random() * 40, life: 0.5, age: 0, r: 5 + Math.random() * 10
      });
    }
  },
  confetti: function (w) {
    // capped so a long victory screen never fills up with particles
    var live = 0;
    for (var i = 0; i < this.list.length; i++) if (this.list[i].t === 'confetti') live++;
    if (live > 90) return;
    this.add({
      t: 'confetti', x: Math.random() * w, y: -12,
      vx: (Math.random() - 0.5) * 50, vy: 60 + Math.random() * 90,
      rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 6,
      w: 5 + Math.random() * 7, h: 8 + Math.random() * 8,
      col: ['#ffd83a', '#5ea0ff', '#ff6a4a', '#ffffff', '#5ce08a'][(Math.random() * 5) | 0],
      life: 6, age: 0
    });
  },
  shock: function (x, y, col) {
    this.add({ t: 'ring', x: x, y: y, life: 0.5, age: 0, r: 10, col: col || '#fff' });
  },
  rage: function (x, y, col) {
    this.add({
      t: 'flame', x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 70,
      vx: (Math.random() - 0.5) * 40, vy: -90 - Math.random() * 90, life: 0.45, age: 0,
      r: 5 + Math.random() * 9, col: col
    });
  },
  stars: function (x, y) {
    this.add({ t: 'star', x: x, y: y, life: 0.9, age: 0, a: Math.random() * 6 });
  },
  popup: function (x, y, s, col, size) {
    this.add({ t: 'popup', x: x, y: y, s: s, col: col, size: size || 30, life: 0.85, age: 0, vy: -60 });
  },
  headPop: function (f) {
    this.add({
      t: 'head', def: f.def, x: f.x, y: RING.floorY - 250, vx: -f.facing * (120 + Math.random() * 90),
      vy: -720, spin: (Math.random() - 0.5) * 12, rot: 0, facing: f.facing, life: 6, age: 0, bounces: 0
    });
  },

  update: function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.age += dt;
      if (p.age >= p.life) { this.list.splice(i, 1); continue; }
      switch (p.t) {
        case 'spark': p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; break;
        case 'sweat': p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; break;
        case 'dust': p.vy += 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 26; break;
        case 'flame': p.x += p.vx * dt; p.y += p.vy * dt; p.r *= 1 - dt * 1.1; break;
        case 'popup': p.y += p.vy * dt; p.vy *= 1 - dt * 3.2; break;
        case 'confetti':
          p.x += p.vx * dt + Math.sin(p.age * 3 + p.rot) * 26 * dt;
          p.y += p.vy * dt; p.rot += p.spin * dt;
          break;
        case 'head':
          p.vy += 1900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
          if (p.y > RING.floorY - 30) {
            p.y = RING.floorY - 30;
            if (Math.abs(p.vy) > 90 && p.bounces < 4) {
              p.vy *= -0.46; p.vx *= 0.6; p.spin *= 0.5; p.bounces++;
              SFX.hit(0.15);
              FX.dust(p.x, RING.floorY, 1);
            } else { p.vy = 0; p.vx *= 0.8; p.spin *= 0.8; }
          }
          break;
      }
    }
  },

  draw: function (ctx) {
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i], k = 1 - p.age / p.life;
      ctx.save();
      switch (p.t) {
        case 'spark':
          ctx.globalAlpha = k;
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, 6.3); ctx.fill();
          break;
        case 'impact':
          ctx.globalAlpha = k * 0.9;
          ctx.translate(p.x, p.y);
          ctx.rotate((1 - k) * 0.6);
          ctx.fillStyle = p.col;
          ctx.beginPath();
          for (var s = 0; s < 12; s++) {
            var a = s / 12 * Math.PI * 2, rr = (s % 2 ? 0.42 : 1) * p.r * (0.5 + (1 - k) * 0.9);
            var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
            s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.closePath(); ctx.fill();
          break;
        case 'sweat':
          ctx.globalAlpha = k;
          ctx.fillStyle = '#cfe9ff';
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 0.7, p.r, 0, 0, 6.3); ctx.fill();
          break;
        case 'dust':
          ctx.globalAlpha = k * 0.35;
          ctx.fillStyle = '#c9b892';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
          break;
        case 'flame':
          ctx.globalAlpha = k * 0.8;
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, 6.3); ctx.fill();
          break;
        case 'confetti':
          ctx.globalAlpha = Math.min(1, k * 4);
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.col;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.5 + 0.5 * Math.abs(Math.cos(p.age * 4))));
          break;
        case 'ring':
          ctx.globalAlpha = k * 0.75;
          ctx.strokeStyle = p.col; ctx.lineWidth = 7 * k;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, 20 + (1 - k) * 210, (20 + (1 - k) * 210) * 0.28, 0, 0, 6.3);
          ctx.stroke();
          break;
        case 'star':
          ctx.globalAlpha = k;
          for (var j = 0; j < 3; j++) {
            var ang = p.a + p.age * 7 + j * 2.1;
            drawStar(ctx, p.x + Math.cos(ang) * 46, p.y + Math.sin(ang) * 15 - 6, 9, '#ffe14a');
          }
          break;
        case 'popup':
          ctx.globalAlpha = Math.min(1, k * 1.8);
          var sc = 1 + (1 - k) * 0.25;
          ctx.translate(p.x, p.y); ctx.scale(sc, sc);
          txt(ctx, p.s, 0, 0, p.size, p.col, 'center', 'rgba(15,8,20,0.9)', p.size * 0.2);
          break;
        case 'head':
          ctx.globalAlpha = Math.min(1, k * 4);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(p.facing, 1);
          var st = { flash: 0, hurt: true, dizzy: false, ko: true, mouth: 0, rage: false, t: p.age };
          HEADS[p.def.art](ctx, p.def.colors, st, 42 * (p.def.headScale || 1));
          break;
      }
      ctx.restore();
    }
  }
};

function drawStar(ctx, x, y, r, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * 0.44 : r;
    var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(90,60,0,0.8)'; ctx.stroke();
  ctx.restore();
}

/* ============================================================== arena */
var CROWD = (function () {
  var arr = [];
  var cols = ['#2b3350', '#3a2c48', '#243b4d', '#3d3550', '#1f2a44', '#4a3440'];
  for (var row = 0; row < 7; row++) {
    for (var i = 0; i < 46; i++) {
      arr.push({
        x: 30 + i * 28 + (row % 2) * 14 + Math.random() * 8,
        y: 200 - row * 26 + Math.random() * 6,
        r: 11 + Math.random() * 4,
        c: cols[(Math.random() * cols.length) | 0],
        ph: Math.random() * 6.3,
        sp: 1.4 + Math.random() * 2.2,
        flash: Math.random() < 0.06
      });
    }
  }
  return arr;
})();

function drawArena(ctx, t, excite) {
  // hall
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0c1c');
  g.addColorStop(0.45, '#141a33');
  g.addColorStop(1, '#070812');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // spotlights
  for (var i = 0; i < 4; i++) {
    var lx = 150 + i * 330 + Math.sin(t * 0.4 + i) * 22;
    var lg = ctx.createRadialGradient(lx, -40, 10, lx, 420, 520);
    lg.addColorStop(0, 'rgba(150,190,255,0.22)');
    lg.addColorStop(1, 'rgba(120,160,255,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(lx - 30, -20); ctx.lineTo(lx + 30, -20);
    ctx.lineTo(lx + 300, 560); ctx.lineTo(lx - 300, 560);
    ctx.closePath(); ctx.fill();
  }

  // crowd
  for (var c = 0; c < CROWD.length; c++) {
    var p = CROWD[c];
    var bob = Math.sin(t * p.sp + p.ph) * (2 + excite * 7);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, p.r, 0, 6.3); ctx.fill();
    ctx.fillRect(p.x - p.r, p.y + bob + p.r * 0.4, p.r * 2, p.r * 1.7);
    if (p.flash && Math.sin(t * 9 + p.ph * 3) > 0.985) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(p.x, p.y + bob - 4, 5, 0, 6.3); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(6,8,18,0.55)';
  ctx.fillRect(0, 0, W, 232);

  // back-wall wordmark, sitting behind the ring so the HUD stays clear
  ctx.save();
  ctx.globalAlpha = 0.42;
  drawRippleMark(ctx, W / 2 - 196, 330, 26, '#2f7dff');
  txt(ctx, 'RIPPLE RUMBLE', W / 2 + 26, 330, 44, '#26346a', 'center', '#151d42', 5);
  ctx.restore();

  // back wall banners
  for (var b = 0; b < 2; b++) {
    var bx = 60 + b * 940;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#16204a';
    ctx.fillRect(bx, 300, 220, 40);
    ctx.strokeStyle = '#2a3a70'; ctx.lineWidth = 2; ctx.strokeRect(bx, 300, 220, 40);
    txt(ctx, ['KNOCK HIS BLOCK OFF', 'NO BLOCK, NO GLORY'][b], bx + 110, 321, 15, '#7f9ad6', 'center', null, 0, FONT_UI);
    ctx.restore();
  }

  drawRing(ctx, t);
}

function drawRing(ctx, t) {
  var backY = 470, frontY = 700;
  var backL = 258, backR = 1022, frontL = 122, frontR = 1158;

  // apron
  ctx.beginPath();
  ctx.moveTo(backL, backY); ctx.lineTo(backR, backY);
  ctx.lineTo(frontR, frontY); ctx.lineTo(frontL, frontY);
  ctx.closePath();
  var mg = ctx.createLinearGradient(0, backY, 0, frontY);
  mg.addColorStop(0, '#2b3f6e');
  mg.addColorStop(0.5, '#22345c');
  mg.addColorStop(1, '#16223e');
  ctx.fillStyle = mg; ctx.fill();

  // mat logo
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(backL, backY); ctx.lineTo(backR, backY); ctx.lineTo(frontR, frontY); ctx.lineTo(frontL, frontY);
  ctx.closePath(); ctx.clip();
  ctx.globalAlpha = 0.30;
  ctx.save();
  ctx.translate(W / 2, 610); ctx.scale(1, 0.44);
  drawRippleMark(ctx, 0, 0, 120, '#4f8dff');
  ctx.restore();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#9dc2ff'; ctx.lineWidth = 3;
  for (var i = 1; i < 6; i++) {
    var yy = backY + (frontY - backY) * (i / 6);
    var k = (i / 6);
    ctx.beginPath();
    ctx.moveTo(lerp(backL, frontL, k), yy); ctx.lineTo(lerp(backR, frontR, k), yy); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // mat scuffs
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, backY, W, 8);
  ctx.restore();

  // mat edge
  ctx.strokeStyle = '#0d1428'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(backL, backY); ctx.lineTo(backR, backY); ctx.lineTo(frontR, frontY); ctx.lineTo(frontL, frontY);
  ctx.closePath(); ctx.stroke();
  // skirt
  ctx.fillStyle = '#0b1024';
  ctx.beginPath();
  ctx.moveTo(frontL, frontY); ctx.lineTo(frontR, frontY); ctx.lineTo(frontR, H); ctx.lineTo(frontL, H);
  ctx.closePath(); ctx.fill();

  // back ropes + posts
  drawPost(ctx, backL, backY, 0.72);
  drawPost(ctx, backR, backY, 0.72);
  ctx.save();
  ctx.lineCap = 'round';
  for (var r = 0; r < 3; r++) {
    var ry = backY - 28 - r * 40;
    ctx.strokeStyle = ['#d8d8e8', '#c33', '#d8d8e8'][r];
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(backL, ry);
    ctx.quadraticCurveTo(W / 2, ry + 7, backR, ry);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(backL, ry - 2);
    ctx.quadraticCurveTo(W / 2, ry + 5, backR, ry - 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRopesFront(ctx) {
  var frontY = 700, frontL = 122, frontR = 1158;
  ctx.save();
  ctx.lineCap = 'round';
  for (var r = 0; r < 3; r++) {
    var ry = frontY - 34 - r * 62;
    ctx.globalAlpha = 0.92;
    ctx.strokeStyle = ['#e2e2ee', '#d33a3a', '#e2e2ee'][r];
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(frontL, ry);
    ctx.quadraticCurveTo(W / 2, ry + 12, frontR, ry);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(frontL, ry - 3);
    ctx.quadraticCurveTo(W / 2, ry + 9, frontR, ry - 3);
    ctx.stroke();
  }
  ctx.restore();
  drawPost(ctx, frontL, frontY, 1.12);
  drawPost(ctx, frontR, frontY, 1.12);
}

function drawPost(ctx, x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  var g = ctx.createLinearGradient(-14, 0, 14, 0);
  g.addColorStop(0, '#39406a'); g.addColorStop(0.4, '#7c88c8'); g.addColorStop(1, '#232846');
  ctx.fillStyle = g;
  rrect(ctx, -13, -212, 26, 220, 10); ctx.fill();
  ctx.strokeStyle = '#11162c'; ctx.lineWidth = 3; ctx.stroke();
  // pad wrap
  ctx.fillStyle = '#1a4fd0';
  rrect(ctx, -17, -196, 34, 150, 12); ctx.fill();
  ctx.strokeStyle = '#0d2a78'; ctx.lineWidth = 3; ctx.stroke();
  ctx.save();
  rrect(ctx, -17, -196, 34, 150, 12); ctx.clip();
  drawRippleMark(ctx, 0, -120, 13, '#cfe3ff');
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(-16, -196, 9, 150);
  ctx.restore();
  ctx.fillStyle = '#c9d2ee';
  rrect(ctx, -16, -224, 32, 16, 6); ctx.fill();
  ctx.strokeStyle = '#11162c'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}

/* ================================================================== HUD */
function drawHeadIcon(ctx, def, x, y, r, flip) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3);
  ctx.fillStyle = '#0c1226'; ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.scale(flip ? -1 : 1, 1);
  var s = r / 46;
  ctx.scale(s, s);
  ctx.translate(0, 6);
  HEADS[def.art](ctx, def.colors, { flash: 0, hurt: false, dizzy: false, ko: false, mouth: 0, rage: false, t: 0 }, 42 * (def.headScale || 1));
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = def.colors.accent; ctx.stroke();
  ctx.restore();
}

function bar(ctx, x, y, w, h, pct, colA, colB, flip, skew) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) { ctx.scale(-1, 1); }
  skew = skew === undefined ? 10 : skew;
  function shape(ww) {
    ctx.beginPath();
    ctx.moveTo(skew, 0); ctx.lineTo(ww, 0); ctx.lineTo(ww - skew, h); ctx.lineTo(0, h);
    ctx.closePath();
  }
  shape(w);
  ctx.fillStyle = 'rgba(8,10,22,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(180,200,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  var iw = Math.max(0, (w - 4) * clamp(pct, 0, 1));
  if (iw > 3) {
    ctx.save();
    shape(w - 3); ctx.clip();
    ctx.translate(2, 2);
    var g = ctx.createLinearGradient(0, 0, 0, h - 4);
    g.addColorStop(0, colB); g.addColorStop(0.5, colA); g.addColorStop(1, colB);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(skew, 0); ctx.lineTo(iw, 0); ctx.lineTo(iw - skew, h - 4); ctx.lineTo(0, h - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(0, 0, iw, (h - 4) * 0.32);
    ctx.restore();
  }
  ctx.restore();
}

function drawHUD(ctx, G) {
  var p1 = G.f1, p2 = G.f2, t = G.time;

  [[p1, false], [p2, true]].forEach(function (pair) {
    var f = pair[0], flip = pair[1];
    var x = flip ? W - 34 : 34;
    var dir = flip ? -1 : 1;
    // ghost (damage trail) bar
    var hpPct = f.hp / f.maxHp;
    var ghost = f.hpGhost === undefined ? hpPct : f.hpGhost;
    bar(ctx, x + dir * 84, 30, 430 * dir === 0 ? 430 : 430, 30, ghost, '#ff5a4a', '#8a1b12', flip);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    var col = hpPct > 0.55 ? ['#59e07a', '#1d7a3a'] : hpPct > 0.25 ? ['#f2c230', '#8a6a0d'] : ['#ff6a4a', '#8a2010'];
    bar(ctx, x + dir * 84, 30, 430, 30, hpPct, col[0], col[1], flip);

    // stamina
    bar(ctx, x + dir * 84, 64, 330, 11, f.stam / f.maxStam, '#69d2ff', '#1c5f8c', flip, 6);
    // super meter
    var mp = f.meter / 100;
    bar(ctx, x + dir * 84, 79, 330, 13, mp, mp >= 1 ? '#ffe14a' : '#b06cff', mp >= 1 ? '#c98f00' : '#4b2a8a', flip, 6);
    if (mp >= 1) {
      txt(ctx, 'SUPER READY', x + dir * 250, 86, 13, '#ffe98a', 'center', '#3a2500', 3, FONT_UI);
    }

    drawHeadIcon(ctx, f.def, x + dir * 40, 52, 36, flip);
    txt(ctx, f.def.name, x + dir * 88, 105, 20, '#dfe8ff', flip ? 'right' : 'left', '#0a0f22', 4);

    // round pips
    for (var i = 0; i < G.roundsToWin; i++) {
      var px = x + dir * (96 + i * 26);
      ctx.save();
      ctx.translate(px, 128);
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 6.3);
      ctx.fillStyle = i < f.wins ? '#ffd83a' : 'rgba(255,255,255,0.13)';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
      ctx.restore();
    }
    // status tags
    var tag = f.buff > 0 ? 'FRENZY ' + f.buff.toFixed(1) : (f.stam <= 0 ? 'EXHAUSTED' : (f.state === 'dizzy' ? 'DIZZY' : ''));
    if (tag) txt(ctx, tag, x + dir * 260, 105, 17, '#ff9b4a', flip ? 'right' : 'left', '#2a0f00', 4, FONT_UI);
  });

  // online status: who you are in this bout, and the round-trip
  if (G.online) {
    if (NET.isSpectator()) {
      txt(ctx, 'SPECTATING  ·  ESC TO LEAVE', W / 2, 148, 16, '#ffd83a', 'center', '#241800', 4, FONT_UI);
    } else {
      var mineIsLeft = NET.isHost();
      var yx = mineIsLeft ? 300 : W - 300;
      txt(ctx, 'YOU', yx, 128, 18, '#5ce08a', 'center', '#04160a', 5);
      var pg = NET.ping();
      var pcol = pg > 220 ? '#ff6a4a' : (pg > 120 ? '#f2c230' : '#5ce08a');
      var line = 'ONLINE  ' + (pg ? pg + 'ms' : '—');
      var wn = NET.watchers();
      if (wn) line += '   ·   ' + wn + (wn === 1 ? ' WATCHING' : ' WATCHING');
      txt(ctx, line, W / 2, 148, 15, pcol, 'center', '#05070f', 4, FONT_UI);
    }
  }

  // clock
  ctx.save();
  ctx.translate(W / 2, 62);
  rrect(ctx, -58, -34, 116, 72, 12);
  ctx.fillStyle = 'rgba(8,10,24,0.9)'; ctx.fill();
  ctx.strokeStyle = G.clock <= 10 ? '#ff5a4a' : '#4a5a96'; ctx.lineWidth = 3; ctx.stroke();
  txt(ctx, Math.ceil(Math.max(0, G.clock)).toString(), 0, -2, 44, G.clock <= 10 ? '#ff7a5a' : '#eef3ff');
  txt(ctx, 'ROUND ' + G.round, 0, 24, 14, '#8296d0', 'center', null, 0, FONT_UI);
  ctx.restore();
}

/* ------------------------------------------------- combo / announcements */
function drawAnnouncements(ctx, G) {
  // combo counters
  [G.f1, G.f2].forEach(function (f) {
    if (f.combo >= 2 && f.comboT > 0) {
      var a = clamp(f.comboT * 2, 0, 1);
      var x = f.side < 0 ? 300 : W - 300;
      ctx.save();
      ctx.globalAlpha = a;
      var pop = 1 + Math.max(0, 0.35 - (0.4 - clamp(f.comboT, 0, 0.4))) * 0.3;
      ctx.translate(x, 210); ctx.scale(pop, pop);
      txt(ctx, f.combo + ' HIT', 0, 0, 46, '#ffe14a', 'center', '#3a1d00', 9);
      txt(ctx, 'COMBO', 0, 34, 20, '#ffb347', 'center', '#3a1d00', 5);
      ctx.restore();
    }
  });

  if (G.ann && G.annT > 0) {
    var k = clamp(G.annT / G.annDur, 0, 1);
    var scale = 1 + Math.pow(1 - k, 2) * 0.6;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 3);
    ctx.translate(W / 2 + (G.annSide || 0) * 0, 262);
    ctx.rotate(Math.sin((1 - k) * 12) * 0.02);
    ctx.scale(scale, scale);
    txt(ctx, G.ann, 0, 0, 62, G.annCol || '#fff', 'center', '#120820', 13);
    ctx.restore();
  }
}

/* ===== js/touch.js ===== */
/* =========================================================================
   RIPPLE RUMBLE — touch

   Phones get the same game, driven the same way. Rather than teach the
   engine about touch, every control here writes into the SAME KeyDown /
   KeyHit maps the keyboard fills, using Player 1's key codes. Holds become
   held keys, taps become key presses, and a double tap on a direction is a
   dash because the existing double-tap detector sees two presses.

   Menus register tap zones as they draw, so a tap lands on whatever the
   player can actually see, at canvas coordinates — no separate layout.
   ========================================================================= */
var TOUCH = (function () {

  var active = false;            // a touch has been used: show the controls
  var zones = [];                // rebuilt every frame by whatever is drawing
  var held = {};                 // pointerId -> zone key currently held
  var pressed = {};              // zone key -> true while any pointer holds it
  var canvas = null;

  /* ------------------------------------------------------- coordinates */
  function toCanvas(ev) {
    var r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return { x: -1, y: -1 };
    return {
      x: (ev.clientX - r.left) * (1280 / r.width),
      y: (ev.clientY - r.top) * (720 / r.height)
    };
  }

  function hit(p) {
    // last registered wins, so controls drawn on top of panels take the tap
    for (var i = zones.length - 1; i >= 0; i--) {
      var z = zones[i];
      if (p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h) return z;
    }
    return null;
  }

  /* ----------------------------------------------------------- pointers */
  function down(ev) {
    if (ev.pointerType === 'touch' || ev.pointerType === 'pen') active = true;
    var p = toCanvas(ev);
    var z = hit(p);
    if (!z) return;
    ev.preventDefault();
    held[ev.pointerId] = z.key;
    pressed[z.key] = true;
    if (z.code) {
      // Every touch is a fresh key press, hold or not — the double-tap
      // detector behind dashing counts presses, so the movement pads must
      // register them too.
      KeyHit[z.code] = true;
      KeyDown[z.code] = true;
      if (!z.hold) setTimeout(function () { KeyDown[z.code] = false; }, 40);
    }
    if (z.tap) z.tap();
  }

  function move(ev) {
    if (!(ev.pointerId in held)) return;
    // sliding off a held control releases it, so a thumb can leave the pad
    var z = hit(toCanvas(ev));
    var wasKey = held[ev.pointerId];
    if (z && z.key === wasKey) return;
    release(ev.pointerId);
    if (z && z.hold) {
      held[ev.pointerId] = z.key;
      pressed[z.key] = true;
      if (z.code) KeyDown[z.code] = true;
    }
  }

  function release(pointerId) {
    var key = held[pointerId];
    if (key === undefined) return;
    delete held[pointerId];
    var stillHeld = false;
    for (var id in held) if (held[id] === key) stillHeld = true;
    if (!stillHeld) {
      pressed[key] = false;
      var z = zoneByKey(key);
      if (z && z.code && z.hold) KeyDown[z.code] = false;
    }
  }
  function up(ev) { release(ev.pointerId); }

  function zoneByKey(key) {
    for (var i = 0; i < zones.length; i++) if (zones[i].key === key) return zones[i];
    return null;
  }

  function attach(cv) {
    canvas = cv;
    cv.addEventListener('pointerdown', down, { passive: false });
    cv.addEventListener('pointermove', move, { passive: false });
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', up);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function () { active = false; });   // back to keyboard
  }

  /* -------------------------------------------------------------- zones */
  function begin() { zones.length = 0; }

  /** Register a rectangle. `code` is the P1 key it stands for; `hold` keeps
   *  it down while touched; `tap` is an extra callback for menu actions. */
  function zone(key, x, y, w, h, opts) {
    opts = opts || {};
    zones.push({ key: key, x: x, y: y, w: w, h: h, code: opts.code, hold: !!opts.hold, tap: opts.tap });
    return !!pressed[key];
  }

  /* ------------------------------------------------------------ drawing */
  function pad(ctx, key, cx, cy, r, label, opts) {
    opts = opts || {};
    var on = zone(key, cx - r, cy - r, r * 2, r * 2, opts);
    ctx.save();
    ctx.globalAlpha = opts.dim ? 0.30 : (on ? 0.92 : 0.62);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.3);
    var g = ctx.createRadialGradient(cx, cy - r * 0.35, r * 0.2, cx, cy, r);
    g.addColorStop(0, on ? (opts.hot || '#7fd0ff') : 'rgba(40,52,92,0.95)');
    g.addColorStop(1, on ? (opts.hot || '#2f6fb0') : 'rgba(12,18,40,0.95)');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = on ? 5 : 3;
    ctx.strokeStyle = opts.ring || (on ? '#cfe8ff' : 'rgba(150,180,240,0.75)');
    ctx.stroke();
    ctx.globalAlpha = 1;
    txt(ctx, label, cx, cy + (opts.sub ? -6 : 0), opts.size || 24, on ? '#ffffff' : '#cfe0ff', 'center', 'rgba(6,10,24,0.9)', 5);
    if (opts.sub) txt(ctx, opts.sub, cx, cy + 16, 12, 'rgba(190,210,255,0.85)', 'center', null, 0, FONT_UI);
    ctx.restore();
    return on;
  }

  /* --------------------------------------------- the in-fight controls */
  function fightPads(ctx, G) {
    if (!active) return;
    var meterFull = false;
    try {
      var mine = G.online ? (NET.isSpectator() ? null : (NET.isHost() ? G.f1 : G.f2))
        : G.f1;
      meterFull = mine && mine.meter >= 100;
    } catch (e) { }

    // Sized for thumbs, not cursors: the canvas is scaled down on a phone,
    // so a 62px radius here lands near a 60px touch target on a handset.
    // left thumb: move, guard, duck
    pad(ctx, 'left', 88, 602, 62, '◀', { code: 'KeyA', hold: true, size: 30 });
    pad(ctx, 'right', 226, 602, 62, '▶', { code: 'KeyD', hold: true, size: 30 });
    pad(ctx, 'guard', 88, 466, 56, 'GUARD', { code: 'KeyS', hold: true, size: 17 });
    pad(ctx, 'duck', 226, 466, 56, 'DUCK', { code: 'KeyW', hold: true, size: 18 });

    // right thumb: punches
    pad(ctx, 'jab', 1192, 602, 62, 'JAB', { code: 'KeyF', size: 22, hot: '#7fe0a0' });
    pad(ctx, 'body', 1054, 602, 58, 'BODY', { code: 'KeyH', size: 18, hot: '#ffc46a' });
    pad(ctx, 'hook', 1192, 466, 58, 'HOOK', { code: 'KeyG', size: 19, hot: '#ff8a6a' });
    pad(ctx, 'super', 1054, 466, 56, 'SUPER', {
      code: 'Space', size: 17, hot: '#ffe14a', dim: !meterFull,
      ring: meterFull ? '#ffe14a' : null
    });

    // leave / pause, tucked between the two thumbs
    pad(ctx, 'leave', 640, 686, 30, '✕', { code: 'Escape', size: 20 });
  }

  /* ------------------------------------------------------ menu helpers */
  /** A labelled button. Only drawn for touch users; desktop keeps its
   *  keyboard hints and stays visually unchanged. */
  function btn(ctx, x, y, w, h, label, opts) {
    opts = opts || {};
    if (!active && !opts.always) return false;
    var on = zone(opts.key || ('b:' + label + x + y), x, y, w, h, { code: opts.code, tap: opts.tap });
    ctx.save();
    rrect(ctx, x, y, w, h, opts.r || 10);
    ctx.fillStyle = on ? (opts.hotFill || 'rgba(111,176,255,0.95)')
      : (opts.fill || 'rgba(12,18,40,0.88)');
    ctx.fill();
    ctx.lineWidth = on ? 4 : 2.5;
    ctx.strokeStyle = opts.stroke || (on ? '#e6f2ff' : 'rgba(150,180,240,0.8)');
    ctx.stroke();
    txt(ctx, label, x + w / 2, y + h / 2 + 1, opts.size || 18,
      on ? '#ffffff' : (opts.color || '#cfe0ff'), 'center', 'rgba(6,10,24,0.9)', 4);
    ctx.restore();
    return on;
  }

  /** Every screen that can be left needs one of these on a phone. */
  function backBtn(ctx, label) {
    return btn(ctx, 22, 16, 138, 48, label || '‹  BACK', { code: 'Escape', key: 'backbtn', size: 17 });
  }

  /** A full-screen tap that stands for Enter (title, result screens).
   *  Registered even before the first touch, so the very first tap counts —
   *  and it makes these screens clickable with a mouse too. */
  function anywhere(code) {
    zone('anywhere', 0, 0, 1280, 720, { code: code || 'Enter' });
  }

  /** A list row: tapping it moves the cursor there and confirms. Also live
   *  for mouse users, who reasonably expect to click a menu item. */
  function row(key, x, y, w, h, onPick) {
    return zone(key, x, y, w, h, { tap: onPick });
  }

  function isActive() { return active; }
  function setActive(v) { active = !!v; }

  return {
    attach: attach, begin: begin, zone: zone, pad: pad, btn: btn, backBtn: backBtn,
    fightPads: fightPads, anywhere: anywhere, row: row,
    isActive: isActive, setActive: setActive,
    pressed: function (k) { return !!pressed[k]; }
  };
})();

/* ===== js/main.js ===== */
/* =========================================================================
   RIPPLE RUMBLE — scenes, input, match flow
   ========================================================================= */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var hintEl = document.getElementById('hint');

/* ------------------------------------------------------------------ input */
var KeyDown = {}, KeyHit = {};
var CTRL = {
  p1: {
    left: ['KeyA'], right: ['KeyD'], block: ['KeyS'], duck: ['KeyW'],
    jab: ['KeyF'], hook: ['KeyG'], body: ['KeyH'], special: ['KeyT', 'Space']
  },
  p2: {
    left: ['ArrowLeft'], right: ['ArrowRight'], block: ['ArrowDown'], duck: ['ArrowUp'],
    jab: ['Numpad1', 'Comma', 'KeyJ'], hook: ['Numpad2', 'Period', 'KeyK'],
    body: ['Numpad3', 'Slash', 'KeyL'], special: ['Numpad0', 'ShiftRight', 'KeyU']
  }
};
var tapTime = { p1: { l: -9, r: -9 }, p2: { l: -9, r: -9 } };

function isDown(codes) {
  for (var i = 0; i < codes.length; i++) if (KeyDown[codes[i]]) return true;
  return false;
}
function isHit(codes) {
  for (var i = 0; i < codes.length; i++) if (KeyHit[codes[i]]) return true;
  return false;
}
function anyAttackHit(scheme) {
  var c = CTRL[scheme];
  return isHit(c.jab) || isHit(c.hook) || isHit(c.body) || isHit(c.special) || isHit(c.block);
}

window.addEventListener('keydown', function (e) {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0) e.preventDefault();
  if (!KeyDown[e.code]) KeyHit[e.code] = true;
  KeyDown[e.code] = true;
  SFX.init();
  if (hintEl && !hintEl.classList.contains('gone')) hintEl.classList.add('gone');
});
window.addEventListener('keyup', function (e) { KeyDown[e.code] = false; });
window.addEventListener('blur', function () { KeyDown = {}; });
canvas.addEventListener('mousedown', function () {
  SFX.init();
  if (hintEl) hintEl.classList.add('gone');
});
// a touch is also the gesture browsers require before audio may play
canvas.addEventListener('pointerdown', function () {
  SFX.init();
  if (hintEl) hintEl.classList.add('gone');
}, { passive: true });
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      var p = document.documentElement.requestFullscreen();
      if (p && p.then) p.then(function () {
        // phones: pin to landscape once we own the screen
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () { }); } catch (e) { }
      }).catch(function () { });
    } else document.exitFullscreen();
  } catch (e) { }
}
canvas.addEventListener('dblclick', toggleFullscreen);

function readControls(f, scheme, tNow) {
  var c = CTRL[scheme], i = f.in;
  i.left = isDown(c.left); i.right = isDown(c.right);
  i.block = isDown(c.block); i.duck = isDown(c.duck);
  i.jab = isHit(c.jab); i.hook = isHit(c.hook); i.body = isHit(c.body);
  i.special = isHit(c.special);
  i.dash = 0;
  var tt = tapTime[scheme];
  if (isHit(c.left)) { if (tNow - tt.l < 0.26) { i.dash = -1; tt.l = -9; } else tt.l = tNow; }
  if (isHit(c.right)) { if (tNow - tt.r < 0.26) { i.dash = 1; tt.r = -9; } else tt.r = tNow; }
}

/* =========================================================================
   GAME
   ========================================================================= */
var G = {
  scene: 'title',
  t: 0,
  timeScale: 1,
  hitstop: 0,
  shakeAmt: 0, shakeX: 0, shakeY: 0,
  flashAmt: 0, flashCol: '#fff',
  ann: '', annT: 0, annDur: 1, annCol: '#fff', annSide: 0,
  fx: FX,
  projectiles: [],
  roundsToWin: 2,
  round: 1,
  clock: 99,
  mode: 'arcade',
  difficulty: 1.0,
  diffName: 'NORMAL',
  sel: [0, 1],
  selLocked: [false, false],
  menuIndex: 0,
  ladder: [], ladderIndex: 0,
  f1: null, f2: null, ai1: null, ai2: null,
  ctrl1: 'p1', ctrl2: 'cpu',
  phase: '',
  phaseT: 0,
  musicOn: true, sfxOn: true,   // mirrors SFX, for the on-screen toggles
  online: false,            // this bout is being played over the wire
  netEpoch: -1              // which net match the local fighters belong to
};
bindGame(G);

G.shake = function (a) { this.shakeAmt = Math.max(this.shakeAmt, a); };
G.flash = function (a, col) { this.flashAmt = Math.max(this.flashAmt, a); this.flashCol = col || '#fff'; };
G.announce = function (s, side, col, dur) {
  this.ann = s; this.annT = dur || 1.1; this.annDur = dur || 1.1;
  this.annCol = col || '#ffffff'; this.annSide = side || 0;
};

/* ---------------------------------------------------------- hit handling */
G.tryHit = function (a, d, atk) {
  var dist = Math.abs(d.x - a.x);
  if (Math.sign(d.x - a.x) !== a.facing) return false;
  if (dist > atk.reach + 26) return false;

  var hx = a.x + a.facing * (atk.reach * 0.72);
  var hy = RING.floorY - (atk.height === 'body' ? 150 : 232) + d.pose.crouch * 30;

  // evasion
  if (d.iframes > 0 || d.state === 'dodge') {
    FX.popup(d.x, RING.floorY - 300, 'DODGE!', '#9fe8ff', 26);
    SFX.whiff();
    return false;
  }
  if (d.state === 'duck' && atk.height === 'head' && !atk.superMove) {
    FX.popup(d.x, RING.floorY - 300, 'WEAVE!', '#9fe8ff', 26);
    SFX.whiff();
    return false;
  }
  if (d.state === 'down' || d.state === 'ko') return false;

  // block
  var blocking = (d.state === 'block') && !atk.unblockable;
  if (blocking) {
    // EL LOBO parry
    if (d.def.id === 'lobo' && d.blockTime < 0.14 && !atk.superMove) {
      SFX.parry(); NET.event(2, hx, hy, 0.6);
      FX.spark(hx, hy, 0.6, '#9fe8ff');
      FX.popup(d.x, RING.floorY - 310, 'PARRY!', '#9fe8ff', 34);
      G.flash(0.35, '#bfe9ff'); G.shake(8); G.hitstop = 0.10;
      d.meter = clamp(d.meter + 18, 0, 100);
      a.setState('hitstun', 0.34); a.vx = -a.facing * 150;
      // free counter — fired directly, since an input flag set here would be
      // overwritten before the parrying fighter's own update runs
      d.setState('idle');
      d.facing = a.x >= d.x ? 1 : -1;
      d.tryAttack('jab');
      return true;
    }
    if (atk.guardBreak) {
      d.setState('hitstun', 0.7);
      d.stun = 100;
      this.applyDamage(a, d, atk, 'guardbreak', 0.55);
      FX.popup(d.x, RING.floorY - 320, 'GUARD BREAK!', '#ff9b4a', 30);
      NET.event(3, d.x, RING.floorY - 320, 1);
      SFX.superHit();
      return true;
    }
    var mult = atk.height === 'body' ? 0.42 : 0.14;
    if (d.def.id === 'bruiser') mult *= 0.55;                 // ROYAL HIDE
    if (a.buff > 0) mult *= 2.0;                              // frenzy chips guard
    var dmg = atk.dmg * mult * a.damageScale();
    d.hp = Math.max(0, d.hp - dmg);
    d.stam = Math.max(0, d.stam - (atk.stamDmg ? atk.stamDmg * 0.8 : 8 + atk.weight * 12));
    d.meter = clamp(d.meter + 4, 0, 100);
    a.meter = clamp(a.meter + (atk.meter || 4) * 0.5 * a.def.stats.meterRate, 0, 100);
    if (!atk.noBlockPush) {
      d.vx = a.facing * atk.push * 0.5;
      a.vx = -a.facing * atk.push * 0.14;
    }
    d.noHitTime = 0;
    SFX.block(); NET.event(1, hx, hy, 0.25);
    FX.spark(hx, hy, 0.25, '#cfe3ff');
    FX.popup(d.x + a.facing * -20, RING.floorY - 300, 'BLOCK', '#9db4e8', 20);
    G.shake(3 + atk.weight * 4);
    G.hitstop = 0.045;
    if (d.hp <= 0) this.knockdown(d, a);
    return true;
  }

  this.applyDamage(a, d, atk, 'clean', 1);
  return true;
};

G.applyDamage = function (a, d, atk, kind, scale) {
  scale = scale === undefined ? 1 : scale;
  var counter = (d.state === 'attack' && d.atk && d.t < d.atk.startup * 1.1) ||
    (d.state === 'duck' && atk.height === 'body');
  var defFactor = 1 / (0.45 + d.def.stats.defense * 0.55);
  var dmg = atk.dmg * a.damageScale() * defFactor * scale;
  if (counter) dmg *= 1.35;
  if (d.state === 'dizzy') dmg *= 1.4;

  // armour (bruiser hook startup / riptide frenzy)
  var armored = (d.armor > 0 || (d.buff > 0 && atk.weight < 0.9)) && !atk.superMove;
  if (armored) dmg *= 0.55;

  d.hp = Math.max(0, d.hp - dmg);
  d.noHitTime = 0;
  d.stun += atk.stun * (counter ? 1.4 : 1);
  if (atk.stamDmg) d.stam = Math.max(0, d.stam - atk.stamDmg);

  a.meter = clamp(a.meter + (atk.meter || 6) * a.def.stats.meterRate, 0, 100);
  d.meter = clamp(d.meter + (atk.meter || 6) * 0.55 * d.def.stats.meterRate, 0, 100);

  a.combo++; a.comboT = 1.1;
  d.combo = 0;

  var hx = a.x + a.facing * (atk.reach ? atk.reach * 0.7 : 70);
  var hy = RING.floorY - (atk.height === 'body' ? 150 : 236) + d.pose.crouch * 28;

  d.hitFlash = 1;
  var w = clamp(atk.weight, 0.15, 1);
  SFX.hit(w); NET.event(0, hx, hy, w);
  FX.spark(hx, hy, w, counter ? '#ff8a4a' : '#fff0a8');
  FX.sweat(d.x, hy, a.facing);
  G.shake(5 + w * 20);
  G.hitstop = 0.035 + w * 0.075;
  if (w > 0.6) G.flash(0.18, '#ffffff');

  if (counter) FX.popup(d.x, RING.floorY - 318, 'COUNTER!', '#ff8a4a', 28);
  if (kind === 'slam') FX.popup(d.x, RING.floorY - 318, 'SLAM!', '#ffd83a', 34);

  if (!armored || atk.superMove) {
    var hs = 0.18 + w * 0.22;
    d.setState(atk.height === 'body' ? 'hitstunBody' : 'hitstun', hs);
    d.vx = a.facing * atk.push;
    d.pose.headX = a.facing * 4;
  } else {
    FX.popup(d.x, RING.floorY - 300, 'ARMOR', '#c0a0ff', 20);
  }

  if (d.hp <= 0) { this.knockdown(d, a); return; }

  if (d.stun >= 100 && d.state !== 'dizzy') {
    d.stun = 0;
    d.setState('dizzy', 2.3);
    SFX.dizzy();
    FX.stars(d.x, RING.floorY - 300);
    G.announce('DIZZY!', d.side, '#ffe14a', 0.9);
  }
};

G.spawnProjectile = function (f) {
  G.projectiles.push({
    x: f.x + f.facing * 70, y: RING.floorY - 200, vx: f.facing * 620,
    owner: f, life: 2.2, age: 0, r: 26
  });
};

/* ----------------------------------------------------------- knockdowns */
G.knockdown = function (f, by) {
  f.downs++;
  var final = f.downs >= 2;
  f.goDown(final);
  by.combo = 0;
  G.hitstop = 0.28;
  G.shake(30);
  G.flash(0.7, '#ffffff');
  NET.event(7, f.x, RING.floorY - 200, 1);
  SFX.ko();
  if (final) {
    f.st.headless = true;
    FX.headPop(f);
    NET.event(8, f.x, RING.floorY - 240, 1);
    SFX.pop();
    G.phase = 'ko'; G.phaseT = 0;
    G.timeScale = 0.25;
    G.annT = 0;                     // the big K.O. card is drawn by drawFight
    by.setState('win');
    G.winner = by;
  } else {
    G.phase = 'count'; G.phaseT = 0;
    G.countT = 0; G.lastCount = 0;
    f.getUp = 0;
    G.downed = f;
    G.annT = 0;                     // the count overlay announces the knockdown
    G.timeScale = 0.55;
  }
};

/* ----------------------------------------------------------- match setup */
function makeFighters() {
  G.f1 = new Fighter(fighterById(ROSTER[G.sel[0]].id), -1, G.ctrl1 === 'cpu');
  G.f2 = new Fighter(fighterById(ROSTER[G.sel[1]].id), 1, G.ctrl2 === 'cpu');
  G.ai1 = G.ctrl1 === 'cpu' ? new AI(G.f1, G.f1.def.ai, G.difficulty) : null;
  G.ai2 = G.ctrl2 === 'cpu' ? new AI(G.f2, G.f2.def.ai, G.difficulty) : null;
  G.round = 1;
  G.f1.resetMatch(); G.f2.resetMatch();
  startRound(true);
}

function startRound(first) {
  G.f1.resetRound(); G.f2.resetRound();
  G.f1.hpGhost = 1; G.f2.hpGhost = 1;
  G.clock = 99;
  G.projectiles.length = 0;
  FX.clear();
  G.phase = 'intro'; G.phaseT = 0;
  G.timeScale = 1;
  G.winner = null;
  G.downed = null;
  SFX.music('fight');
  SFX.crowd(0.12);
  G.announce('ROUND ' + G.round, 0, '#ffe14a', 1.4);
  SFX.bell(first ? 3 : 1);
  NET.event(5, 0, 0, 0);
}

function endRound(winner, reason) {
  if (G.phase === 'roundend') return;
  G.phase = 'roundend'; G.phaseT = 0;
  G.annT = 0;                      // clear any leftover call-out before the result text
  if (winner) {
    winner.wins++;
    winner.setState('win');
    G.winner = winner;
  }
  var loser = winner === G.f1 ? G.f2 : G.f1;
  if (loser && loser.state !== 'down' && loser.state !== 'ko') loser.setState('idle');
  SFX.bell(2);
  SFX.cheer(1);
  if (winner && winner.wins >= G.roundsToWin) {
    G.announce(reason === 'ko' ? 'K.O.!' : 'WINNER!', 0, '#ffe14a', 2);
  } else {
    G.announce(reason === 'time' ? 'TIME UP!' : 'ROUND ' + G.round, 0, '#ffe14a', 1.6);
  }
}

/* =========================================================================
   SCENE: FIGHT
   ========================================================================= */
function updateFight(dt) {
  var f1 = G.f1, f2 = G.f2;

  // pause (never online — the other player keeps fighting)
  if (!G.online && isHit(['Escape'])) { G.paused = !G.paused; SFX.ui(true); }
  if (G.online && isHit(['Escape'])) { quitOnlineMatch('YOU LEFT THE MATCH'); return; }
  if (G.paused) return;

  if (G.online) { if (!updateOnlineFight(dt)) return; }

  // gather input (always, so menus stay responsive)
  if (!G.online) {
    if (G.ctrl1 === 'cpu') G.ai1.think(dt, f2); else readControls(f1, 'p1', G.t);
    if (G.ctrl2 === 'cpu') G.ai2.think(dt, f1); else readControls(f2, 'p2', G.t);
  }

  // facing
  if (f1.canAct()) f1.facing = f2.x >= f1.x ? 1 : -1;
  if (f2.canAct()) f2.facing = f1.x >= f2.x ? 1 : -1;

  /* ---------- phases ---------- */
  if (G.phase === 'intro') {
    G.phaseT += dt;
    f1.in = {}; f2.in = {};
    if (G.phaseT > 1.5 && !G.introFight) {
      G.introFight = true;
      G.announce('FIGHT!', 0, '#5ce08a', 1.0);
      SFX.bell(1); SFX.cheer(0.6);
      NET.event(5, 0, 0, 0);
    }
    if (G.phaseT > 2.2) { G.phase = 'fight'; G.introFight = false; }
  } else if (G.phase === 'fight') {
    G.clock -= dt;
    if (G.clock <= 0) {
      G.clock = 0;
      var p1p = f1.hp / f1.maxHp, p2p = f2.hp / f2.maxHp;
      if (Math.abs(p1p - p2p) < 0.02) { endRound(null, 'time'); G.announce('DRAW ROUND', 0, '#c0c8e0', 1.8); }
      else endRound(p1p > p2p ? f1 : f2, 'time');
    }
    if (G.clock <= 10 && Math.floor(G.clock) !== G.lastTick) {
      G.lastTick = Math.floor(G.clock);
      if (G.clock > 0) SFX.heartbeat();
    }
  } else if (G.phase === 'count') {
    G.phaseT += dt;
    G.countT += dt / 1.0;
    var n = Math.floor(G.countT) + 1;
    if (n !== G.lastCount && n <= 10) { G.lastCount = n; SFX.count(n); }
    var d = G.downed;
    // Mashing is read from the downed fighter's OWN input, which is already
    // filled in for every mode: local keys, or a remote player's presses
    // relayed by the host. Reading a keyboard here got the online guest (who
    // plays on the right with the P1 keys) and let a host mash the opponent up.
    var dCtrl = (d === f1) ? G.ctrl1 : G.ctrl2;
    if (dCtrl !== 'cpu') {
      // decay first, so a press that reaches the top still reads as full:
      // clamping and then decaying in the same frame capped it just under 1
      d.getUp = Math.max(0, d.getUp - dt * 0.14);
      var i = d.in || {};
      if (i.jab || i.hook || i.body || i.special) d.getUp = Math.min(1, d.getUp + 0.11);
    }
    if (d.getUp >= 1) {
      d.hp = d.maxHp * 0.30;
      d.stun = 0; d.stam = d.maxStam * 0.6; d.st.ko = false;
      d.setState('idle');
      d.x = d.side < 0 ? RING.left + 200 : RING.right - 200;
      (d === f1 ? f2 : f1).x = d.side < 0 ? RING.left + 420 : RING.right - 420;
      G.phase = 'fight'; G.timeScale = 1;
      G.announce('BACK UP!', d.side, '#5ce08a', 1.2);
      SFX.cheer(0.7);
    } else if (G.countT >= 10) {
      d.downs = 2; d.st.headless = true;
      FX.headPop(d); SFX.pop(); SFX.ko();
      G.phase = 'ko'; G.phaseT = 0; G.timeScale = 0.3;
      G.winner = d === f1 ? f2 : f1;
      G.winner.setState('win');
      G.annT = 0;
    }
  } else if (G.phase === 'ko') {
    G.phaseT += dt;
    G.timeScale = lerp(G.timeScale, 1, dt * 0.8);
    if (G.phaseT > 2.4) endRound(G.winner, 'ko');
  } else if (G.phase === 'roundend') {
    G.phaseT += dt;
    G.timeScale = 1;
    if (G.phaseT > 2.6) {
      var champ = f1.wins >= G.roundsToWin ? f1 : (f2.wins >= G.roundsToWin ? f2 : null);
      if (champ) {
        G.matchWinner = champ;
        G.scene = 'result';
        G.resultT = 0;
        G.annT = 0;
        FX.clear();                 // leave the combat popups in the ring
        SFX.music('menu');
        SFX.cheer(1.2);
      } else {
        G.round++;
        startRound(false);
      }
    }
  }

  /* ---------- simulation ---------- */
  var scaled = dt * G.timeScale;
  if (G.hitstop > 0) { G.hitstop -= dt; scaled = 0; }

  if (G.phase !== 'intro') {
    f1.update(scaled, f2);
    f2.update(scaled, f1);

    // separation
    var gap = f2.x - f1.x;
    if (Math.abs(gap) < MIN_GAP) {
      var push = (MIN_GAP - Math.abs(gap)) / 2 * Math.sign(gap || 1);
      f1.x -= push; f2.x += push;
      f1.x = clamp(f1.x, RING.left, RING.right);
      f2.x = clamp(f2.x, RING.left, RING.right);
    }

    // projectiles
    for (var i = G.projectiles.length - 1; i >= 0; i--) {
      var p = G.projectiles[i];
      p.age += scaled; p.x += p.vx * scaled;
      var target = p.owner === f1 ? f2 : f1;
      if (Math.abs(p.x - target.x) < 52 && target.state !== 'down' && target.state !== 'ko') {
        if (target.iframes > 0 || target.state === 'dodge') {
          FX.popup(target.x, RING.floorY - 300, 'DODGE!', '#9fe8ff', 26);
        } else {
          G.tryHit(p.owner, target, {
            key: 'surge', label: 'SURGE', height: 'head', dmg: 17 * p.owner.def.stats.power,
            stun: 45, reach: 999, push: 240, meter: 0, weight: 0.8, superMove: true
          });
          FX.shock(p.x, RING.floorY - 180, '#3B8CFF');
        }
        G.projectiles.splice(i, 1); continue;
      }
      if (p.age > p.life || p.x < RING.left - 80 || p.x > RING.right + 80) G.projectiles.splice(i, 1);
    }
  }

  // hp ghost bars
  [f1, f2].forEach(function (f) {
    var target = f.hp / f.maxHp;
    if (f.hpGhost === undefined) f.hpGhost = target;
    f.hpGhost = f.hpGhost > target ? Math.max(target, f.hpGhost - dt * 0.22) : target;
  });

  // ambience rises with damage dealt
  var heat = 1 - Math.min(f1.hp / f1.maxHp, f2.hp / f2.maxHp);
  SFX.crowd(0.07 + heat * 0.12, 1.5);

  // the host is the authority: publish the settled frame
  if (G.online && NET.isHost()) NET.pushHost(G);
}

/* ------------------------------------------------------------- fight draw */
function drawFight() {
  var f1 = G.f1, f2 = G.f2;
  var mid = (f1.x + f2.x) / 2;
  var dist = Math.abs(f1.x - f2.x);
  var zoom = clamp(1.18 - dist / 2600, 1.02, 1.13);
  var maxOff = (W / 2) * (1 - 1 / zoom);
  var camX = clamp(mid - W / 2, -maxOff, maxOff);

  ctx.save();
  ctx.translate(W / 2 + G.shakeX, 470 + G.shakeY);
  ctx.scale(zoom, zoom);
  ctx.translate(-W / 2 - camX, -470);

  drawArena(ctx, G.t, clamp(1 - Math.min(f1.hp / f1.maxHp, f2.hp / f2.maxHp), 0, 1));

  // fighters (further-back one first — the left fighter stands slightly upstage)
  var order = f1.x <= f2.x ? [f1, f2] : [f2, f1];
  order.forEach(function (f, idx) {
    var depth = f === order[0] ? -14 : 0;
    drawFighterShadowed(f, depth);
  });

  // projectiles
  G.projectiles.forEach(function (p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.9;
    var g = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
    g.addColorStop(0, '#dff0ff'); g.addColorStop(0.4, '#3B8CFF'); g.addColorStop(1, 'rgba(59,140,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 46, 38, 0, 0, 6.3); ctx.fill();
    ctx.rotate(p.age * 7);
    drawRippleMark(ctx, 0, 0, 16, '#ffffff');
    ctx.restore();
  });

  FX.draw(ctx);
  drawRopesFront(ctx);
  ctx.restore();

  drawHUD(ctx, G);
  TOUCH.fightPads(ctx, G);
  drawAnnouncements(ctx, G);

  // dizzy / low-health vignette
  var low = Math.min(f1.hp / f1.maxHp, f2.hp / f2.maxHp);
  if (low < 0.25) {
    var v = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 760);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(120,0,0,' + (0.30 * (1 - low / 0.25)) + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  if (G.phase === 'count' && G.downed) {
    drawCount();
  }
  if (G.phase === 'ko') {
    ctx.save();
    ctx.globalAlpha = clamp(1 - G.phaseT / 2.4, 0, 1) * 0.35;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    var s = clamp(G.phaseT * 3, 0, 1);
    ctx.save();
    ctx.translate(W / 2, 300);
    ctx.scale(1 + (1 - s) * 2, 1 + (1 - s) * 2);
    ctx.rotate((1 - s) * 0.4);
    txt(ctx, 'K.O.!', 0, 0, 150, '#ff5a4a', 'center', '#2a0000', 20);
    ctx.restore();
    txt(ctx, G.winner ? G.winner.def.name + ' WINS THE ROUND' : '', W / 2, 400, 30, '#ffe6b0', 'center', '#2a1200', 7);
  }
  if (G.phase === 'roundend' && G.winner) {
    txt(ctx, G.winner.def.name, W / 2, 300, 62, '#ffe14a', 'center', '#2a1a00', 12);
    txt(ctx, G.winner.wins >= G.roundsToWin ? 'WINS THE MATCH' : 'TAKES THE ROUND', W / 2, 356, 28, '#fff', 'center', '#2a1a00', 7);
    txt(ctx, '"' + G.winner.def.quip + '"', W / 2, 402, 22, '#9fb4e8', 'center', '#101830', 5, FONT_UI);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(4,6,16,0.75)'; ctx.fillRect(0, 0, W, H);
    txt(ctx, 'PAUSED', W / 2, 260, 80, '#fff', 'center', '#000', 14);
    if (TOUCH.isActive()) {
      TOUCH.btn(ctx, W / 2 - 230, 340, 210, 62, 'RESUME', { key: 'presume', size: 22, code: 'Escape' });
      TOUCH.btn(ctx, W / 2 + 20, 340, 210, 62, 'QUIT', {
        key: 'pquit', size: 22,
        tap: function () { G.scene = 'title'; G.paused = false; SFX.music('menu'); SFX.crowd(0.05); }
      });
    } else {
      txt(ctx, 'ESC to resume  ·  BACKSPACE to quit to menu', W / 2, 372, 22, '#9fb4e8', 'center', null, 0, FONT_UI);
    }
    if (isHit(['Backspace'])) { G.scene = 'title'; G.paused = false; SFX.music('menu'); SFX.crowd(0.05); }
  }
}

function drawFighterShadowed(f, depth) {
  var st = f.st;
  st.t = f.st.t;
  var y = RING.floorY + depth * 0.4;
  var scale = 1 + depth * 0.004;
  if (f.state === 'down' || f.state === 'ko' || (st.headless && f.state !== 'win')) {
    // lying down: rotate the whole toy
    ctx.save();
    ctx.translate(f.x, y);
    var p = clamp(f.downT || 0, 0, 1);
    ctx.rotate(-f.facing * 1.45 * easeOut(p));
    ctx.translate(0, 0);
    drawFighter(ctx, f.def, f.pose, st, 0, 0, f.facing, scale);
    ctx.restore();
    return;
  }
  drawFighter(ctx, f.def, f.pose, st, f.x, y, f.facing, scale);
  // frenzy aura
  if (f.buff > 0) {
    ctx.save();
    ctx.globalAlpha = 0.25 + Math.sin(G.t * 12) * 0.08;
    ctx.strokeStyle = f.def.colors.accent; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(f.x, y - 150, 74, 160, 0, 0, 6.3); ctx.stroke();
    ctx.restore();
  }
  // super-ready shimmer
  if (f.meter >= 100 && f.state !== 'special') {
    ctx.save();
    ctx.globalAlpha = 0.16 + Math.sin(G.t * 7) * 0.07;
    ctx.fillStyle = '#ffe14a';
    ctx.beginPath(); ctx.ellipse(f.x, y - 8, 66, 18, 0, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  if (f.state === 'dizzy') {
    FX.stars(f.x + f.pose.headX, y - 300);
  }
}

function drawCount() {
  var d = G.downed;
  var n = Math.min(10, Math.floor(G.countT) + 1);
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  var pulse = 1 + (1 - (G.countT % 1)) * 0.35;
  ctx.save();
  ctx.translate(W / 2, 250);
  ctx.scale(pulse, pulse);
  txt(ctx, n.toString(), 0, 0, 130, n >= 8 ? '#ff5a4a' : '#ffe14a', 'center', '#2a1000', 16);
  ctx.restore();
  // only the player who is actually on the canvas is told to mash
  var mineDown;
  if (G.online) mineDown = NET.isSpectator() ? false : (d === (NET.isHost() ? G.f1 : G.f2));
  else mineDown = ((d === G.f1) ? G.ctrl1 : G.ctrl2) !== 'cpu';
  txt(ctx, mineDown ? 'MASH PUNCH KEYS TO GET UP!' : d.def.name + ' IS DOWN!', W / 2, 348, 30, '#fff', 'center', '#200', 7);
  // get-up meter
  var bw = 420;
  ctx.save();
  ctx.translate(W / 2 - bw / 2, 380);
  rrect(ctx, 0, 0, bw, 26, 8); ctx.fillStyle = 'rgba(10,12,24,0.9)'; ctx.fill();
  ctx.strokeStyle = '#6a7cb8'; ctx.lineWidth = 3; ctx.stroke();
  ctx.save();
  rrect(ctx, 2, 2, bw - 4, 22, 6); ctx.clip();
  var g = ctx.createLinearGradient(0, 0, bw, 0);
  g.addColorStop(0, '#5ce08a'); g.addColorStop(1, '#ffe14a');
  ctx.fillStyle = g;
  ctx.fillRect(2, 2, (bw - 4) * d.getUp, 22);
  ctx.restore();
  ctx.restore();
}

/* =========================================================================
   SCENE: TITLE
   ========================================================================= */
var titlePose = null;
function drawTitle(dt) {
  ctx.save();
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0e22'); g.addColorStop(0.55, '#141a38'); g.addColorStop(1, '#05060f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // sweeping light
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.translate(W / 2, -160);
  ctx.rotate(Math.sin(G.t * 0.5) * 0.5);
  var lg = ctx.createLinearGradient(0, 0, 0, 900);
  lg.addColorStop(0, 'rgba(90,160,255,0.9)'); lg.addColorStop(1, 'rgba(90,160,255,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(70, 0); ctx.lineTo(420, 900); ctx.lineTo(-420, 900);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // roster line-up
  ROSTER.forEach(function (def, i) {
    var x = 190 + i * 228;
    var bobT = G.t * 2 + i * 1.1;
    var pose = titlePose[i];
    pose.bob = Math.sin(bobT) * 3;
    pose.fg.x = 40 + Math.sin(bobT * 1.3) * 5;
    pose.fg.y = -196 + Math.cos(bobT * 1.1) * 4;
    pose.bg.x = 8 + Math.cos(bobT) * 4;
    pose.bg.y = -208 + Math.sin(bobT * 1.4) * 3;
    pose.headTilt = Math.sin(bobT * 0.7) * 0.05;
    ctx.save();
    ctx.globalAlpha = 0.95;
    drawFighter(ctx, def, pose, { flash: 0, hurt: false, dizzy: false, ko: false, mouth: 0.2, rage: false, t: G.t }, x, 668, i < 2 ? 1 : -1, 0.76);
    ctx.restore();
  });
  // soften the space the logo sits in
  var band = ctx.createLinearGradient(0, 250, 0, 500);
  band.addColorStop(0, 'rgba(5,7,18,0.80)');
  band.addColorStop(1, 'rgba(5,7,18,0)');
  ctx.fillStyle = band;
  ctx.fillRect(0, 250, W, 250);
  var foot = ctx.createLinearGradient(0, 640, 0, H);
  foot.addColorStop(0, 'rgba(5,7,18,0)');
  foot.addColorStop(1, 'rgba(5,7,18,0.92)');
  ctx.fillStyle = foot;
  ctx.fillRect(0, 640, W, H - 640);

  // logo
  ctx.save();
  ctx.translate(W / 2, 186);
  var pulse = 1 + Math.sin(G.t * 2.4) * 0.015;
  ctx.scale(pulse, pulse);
  drawRippleMark(ctx, 0, -92, 46, '#2f7dff');
  txt(ctx, 'RIPPLE RUMBLE', 0, 12, 104, '#f2f7ff', 'center', '#101a3e', 18);
  ctx.save();
  ctx.globalAlpha = 0.35;
  txt(ctx, 'RIPPLE RUMBLE', 0, 12, 104, '#5ea0ff', 'center', null, 0);
  ctx.restore();
  txt(ctx, 'KNOCK  HIS  BLOCK  OFF', 0, 72, 27, '#ffd83a', 'center', '#3a2200', 7);
  ctx.restore();

  var blink = Math.sin(G.t * 4) > -0.3;
  TOUCH.anywhere('Enter');
  if (blink) txt(ctx, TOUCH.isActive() ? 'TAP  TO  START' : 'PRESS  ENTER', W / 2, 408, 42, '#fff', 'center', '#101a3e', 9);
  if (TOUCH.isActive()) {
    // registered after `anywhere`, so these win the tap
    TOUCH.btn(ctx, 24, 648, 168, 52, G.musicOn ? 'MUSIC  ON' : 'MUSIC  OFF', {

/* =========================================================================

var onlineIndex = 0, joinBuf = '', joinMode = false, watchMode = false, watchIndex = 0;
var ONLINE_ACTIONS = [
  { id: 'quick', label: 'QUICK MATCH', desc: 'Pair with anyone else waiting right now.' },

var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

function drawOnline(dt) {
  drawMenuBackdrop();

  ctx.save();

  txt(ctx, pill, 14, 1, 19, pillCol, 'center', null, 0, FONT_UI);
  ctx.restore();

  if (S.kind === 'p2p' && !NET.lobbyPlayers().length) {

  }
  txt(ctx, 'YOU ARE  ' + S.handle, W / 2, 168, 26, '#ffd83a', 'center', '#241800', 6);
  txt(ctx, 'R — NEW NAME', W / 2, 194, 14, '#6d80b4', 'center', null, 0, FONT_UI);
  if (isHit(['KeyR']) && !joinMode) { NET.reroll(); SFX.ui(true); }

  /* ---- who else is here ---- */
  var others = NET.lobbyPlayers();

  var headline = others.length
