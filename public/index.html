<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Ripple Rumble — Knock His Block Off!</title>
<meta name="description" content="A browser boxing game. Five vinyl-toy fighters, one ring, and a knockout that sends the loser's head flying. Play a friend online — no sign-up." />
<meta property="og:title" content="Ripple Rumble" />
<meta property="og:description" content="Pick a fighter, knock his block off. Online versus, no sign-up." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#05060f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070a18'/%3E%3Cg fill='%232f7dff'%3E%3Ccircle cx='20' cy='20' r='9'/%3E%3Ccircle cx='20' cy='44' r='9'/%3E%3Ccircle cx='44' cy='20' r='9'/%3E%3Ccircle cx='44' cy='44' r='9'/%3E%3Cpath d='M20 20 L44 44 M44 20 L20 44' stroke='%232f7dff' stroke-width='9' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root {
    --ring-void: #05060f;
    --ring-deep: #0a0a14;
    --ring-haze: #1b1b33;
    --ring-edge: #22223c;
    --ring-glow: rgba(40, 110, 255, 0.20);
    --ring-dim: #4d5570;
    --ring-text: #dfe6f2;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  /* phones: no rubber-banding, no pinch zoom, no tap flash, no text select */
  html {
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  @supports (height: 100dvh) {
    html, body { height: 100dvh; }     /* ignore the collapsing address bar */
  }

  body {
    background:
      radial-gradient(ellipse at 50% 34%, var(--ring-haze) 0%, var(--ring-deep) 55%, var(--ring-void) 100%);
    color: var(--ring-text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: 16px;
    padding-right: 16px;
    overflow: hidden;
  }

  #stage { display: flex; align-items: center; justify-content: center; max-width: 100%; }

  canvas#game {
    display: block;
    max-width: 100%;
    background: var(--ring-void);
    border-radius: 6px;
    box-shadow:
      0 0 0 2px var(--ring-edge),
      0 0 60px var(--ring-glow),
      0 24px 70px rgba(0, 0, 0, 0.7);
    touch-action: none;
    cursor: crosshair;
  }
  canvas#game:focus-visible { outline: 3px solid #6fb0ff; outline-offset: 3px; }

  #hint {
    margin: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ring-dim);
    pointer-events: none;
    transition: opacity 0.6s;
    max-width: 90ch;
  }
  #hint.gone { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }

  /* Portrait phone: the ring is 16:9, so ask for a turn rather than
     shrinking it to a letterbox strip. */
  #rotate {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;   /* explicit, for Safari < 14.1 */
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    background: var(--ring-void);
    z-index: 10;
  }
  #rotate strong { font-size: 22px; letter-spacing: 1px; }
  #rotate span { font-size: 15px; color: var(--ring-dim); max-width: 32ch; line-height: 1.5; }
  #rotate .phone {
    width: 54px; height: 92px; border: 3px solid #6fb0ff; border-radius: 10px;
    animation: turn 2.2s ease-in-out infinite;
  }
  @keyframes turn {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }

  /* Driven by JS, not a media query: Safari's orientation feature is
     unreliable here, and inside an iframe it describes the frame rather
     than the phone. The script measures the viewport instead. */
  .rr-rotate #rotate { display: flex; }
  .rr-rotate #stage, .rr-rotate #hint { visibility: hidden; }

  #rotate-skip {
    margin-top: 6px;
    padding: 12px 22px;
    font: inherit;
    font-size: 15px;
    color: var(--ring-text);
    background: rgba(18, 26, 54, 0.9);
    border: 2px solid #33406e;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #rotate-skip:active { background: rgba(47, 125, 255, 0.45); }

  /* on a phone the game should fill the screen; the hint line just wastes it */
  @media (max-width: 900px) {
    #hint { display: none; }
    body { padding: 0; gap: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" tabindex="0"
            aria-label="Ripple Rumble — a boxing game played with the keyboard"></canvas>
  </div>
  <p id="hint">Click the ring for sound &nbsp;·&nbsp; Online PVP is in the main menu &nbsp;·&nbsp; M: music &nbsp;·&nbsp; N: sfx</p>

  <div id="rotate">
    <div class="phone"></div>
    <strong>Turn your phone sideways</strong>
    <span>Ripple Rumble is played in landscape. Rotate to step into the ring.</span>
    <button id="rotate-skip" type="button">Play anyway</button>
  </div>

<script>
/* -------------------------------------------------------------------------
   Multiplayer configuration.

   relay : your deployed Cloudflare Worker, as a wss:// URL. Leave it empty
           and the game goes straight to peer-to-peer — it still works, it is
           just likelier to be blocked on locked-down office wifi.
   p2p   : set false to disable the peer-to-peer fallback entirely.
   ------------------------------------------------------------------------- */
window.RR_CONFIG = {
  relay: "wss://ripple-rumble-relay.kubesmaniac.workers.dev",
  appId: "ripple-rumble",
  p2p: true

  // renderScale: 0.66
  // Phones render at two thirds resolution automatically, dropping further if
  // frames run long. Set this to pin it (1 = full, 0.5 = softest/fastest).
};
</script>

<script>

/* ===== js/audio.js ===== */
/* =========================================================================
   RIPPLE RUMBLE — audio
   All sound is synthesized with WebAudio; no asset files required.
   ========================================================================= */
var SFX = (function () {
  var ac = null, master = null, sfxBus = null, musicBus = null, crowdBus = null;
  var noiseBuf = null;
  var sfxOn = true, musicOn = true;
  var crowdSrc = null, crowdFilter = null;
  var seqTimer = null, step = 0, nextNoteTime = 0, tempo = 148, musicMode = 'none';

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();

    master = ac.createGain(); master.gain.value = 0.85; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = 0.0; musicBus.connect(master);
    crowdBus = ac.createGain(); crowdBus.gain.value = 0.0; crowdBus.connect(master);

    // shared noise buffer (2 s of white noise)
    var len = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    var data = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    startCrowd();
    startSequencer();
  }

  function now() { return ac ? ac.currentTime : 0; }

  function noise(dur, gain, filterType, freq, q) {
    if (!ac || !sfxOn) return null;
    var src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    var f = ac.createBiquadFilter();
    f.type = filterType || 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = q || 1;
    var g = ac.createGain();
    g.gain.setValueAtTime(gain, now());
    g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(); src.stop(now() + dur + 0.02);
    return { src: src, filter: f, gain: g };
  }

  function tone(freq, dur, gain, type, slideTo, delay) {
    if (!ac || !sfxOn) return;
    var t = now() + (delay || 0);
    var o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t + dur + 0.03);
  }

  /* ---------------------------------------------------------- crowd ambience */
  function startCrowd() {
    if (!ac || crowdSrc) return;
    crowdSrc = ac.createBufferSource(); crowdSrc.buffer = noiseBuf; crowdSrc.loop = true;
    crowdFilter = ac.createBiquadFilter();
    crowdFilter.type = 'bandpass'; crowdFilter.frequency.value = 760; crowdFilter.Q.value = 0.6;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2100;
    crowdSrc.connect(crowdFilter); crowdFilter.connect(lp); lp.connect(crowdBus);
    crowdSrc.start();
  }
  function crowd(level, ramp) {
    if (!ac) return;
    crowdBus.gain.cancelScheduledValues(now());
    crowdBus.gain.setValueAtTime(crowdBus.gain.value, now());
    crowdBus.gain.linearRampToValueAtTime(level * (sfxOn ? 1 : 0), now() + (ramp || 0.6));
  }
  function cheer(power) {
    if (!ac || !sfxOn) return;
    power = power || 1;
    crowdBus.gain.cancelScheduledValues(now());
    crowdBus.gain.setValueAtTime(crowdBus.gain.value, now());
    crowdBus.gain.linearRampToValueAtTime(0.42 * power, now() + 0.09);
    crowdBus.gain.linearRampToValueAtTime(0.10, now() + 1.7);
    if (crowdFilter) {
      crowdFilter.frequency.cancelScheduledValues(now());
      crowdFilter.frequency.setValueAtTime(1500, now());
      crowdFilter.frequency.linearRampToValueAtTime(760, now() + 1.6);
    }
  }

  /* ------------------------------------------------------------------ music */
  // Two tiny sequenced loops: menu groove and fight groove.
  var BASS_MENU = [0, 0, 7, 0, 5, 0, 3, 0, 0, 0, 7, 10, 5, 5, 3, 2];
  var BASS_FIGHT = [0, 0, 0, 12, 0, 0, 7, 0, 3, 3, 3, 10, 5, 5, 7, 8];

  function kick(t) {
    if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.2);
  }
  function hat(t, open) {
    if (!ac) return;
    var s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    var g = ac.createGain();
    var d = open ? 0.13 : 0.035;
    g.gain.setValueAtTime(open ? 0.13 : 0.10, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + d + 0.02);
  }
  function snare(t) {
    if (!ac) return;
    var s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + 0.18);
    var o = ac.createOscillator(), og = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t);
    og.gain.setValueAtTime(0.22, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og); og.connect(musicBus); o.start(t); o.stop(t + 0.12);
  }
  function bassNote(t, semi, dur) {
    if (!ac) return;
    var f = 55 * Math.pow(2, semi / 12);
    var o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t);
    lp.frequency.exponentialRampToValueAtTime(260, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function stab(t, semi) {
    if (!ac) return;
    [0, 7, 12].forEach(function (iv) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = 220 * Math.pow(2, (semi + iv) / 12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.055, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.2);
    });
  }

  function scheduleStep(s, t) {
    var fight = musicMode === 'fight';
    var bass = fight ? BASS_FIGHT : BASS_MENU;
    if (s % 4 === 0) kick(t);
    if (fight && (s === 6 || s === 14)) kick(t);
    if (s % 8 === 4) snare(t);
    if (s % 2 === 0 || fight) hat(t, s % 8 === 6);
    bassNote(t, bass[s % 16] - (fight ? 0 : 5), fight ? 0.16 : 0.22);
    if (fight && (s === 0 || s === 10)) stab(t, bass[s % 16]);
    if (!fight && s === 12) stab(t, bass[s % 16] - 5);
  }

  function startSequencer() {
    if (seqTimer) return;
    nextNoteTime = now() + 0.1;
    seqTimer = setInterval(function () {
      if (!ac || musicMode === 'none') { nextNoteTime = now() + 0.1; return; }
      var spb = 60 / tempo / 2; // 8th notes
      while (nextNoteTime < now() + 0.25) {
        scheduleStep(step % 16, nextNoteTime);
        step++;
        nextNoteTime += spb;
      }
    }, 60);
  }

  function music(mode) {
    if (!ac) { musicMode = mode; return; }
    musicMode = mode;
    tempo = mode === 'fight' ? 156 : 126;
    var target = mode === 'none' ? 0 : (musicOn ? (mode === 'fight' ? 0.34 : 0.28) : 0);
    musicBus.gain.cancelScheduledValues(now());
    musicBus.gain.setValueAtTime(musicBus.gain.value, now());
    musicBus.gain.linearRampToValueAtTime(target, now() + 0.5);
  }

  /* ------------------------------------------------------------------- sfx  */
  var api = {
    init: init,
    music: music,
    crowd: crowd,
    cheer: cheer,

    toggleMusic: function () {
      musicOn = !musicOn;
      if (ac) music(musicMode);
      return musicOn;
    },
    toggleSfx: function () {
      sfxOn = !sfxOn;
      if (ac) { sfxBus.gain.value = sfxOn ? 0.9 : 0; crowd(sfxOn ? 0.1 : 0, 0.2); }
      return sfxOn;
    },

    hit: function (weight) {
      // weight 0..1 => light jab to bone-rattling hook
      var w = Math.max(0, Math.min(1, weight));
      noise(0.05 + w * 0.09, 0.5 + w * 0.4, 'lowpass', 900 + (1 - w) * 2600, 1);
      tone(180 - w * 90, 0.11 + w * 0.12, 0.45 + w * 0.35, 'sine', 48 - w * 18);
      if (w > 0.6) tone(70, 0.28, 0.4, 'triangle', 36);
    },
    block: function () {
      noise(0.07, 0.35, 'bandpass', 2600, 3);
      tone(420, 0.06, 0.18, 'square', 260);
    },
    parry: function () {
      tone(1400, 0.08, 0.22, 'square', 2300);
      tone(2100, 0.14, 0.14, 'sine', 3000);
      noise(0.1, 0.25, 'highpass', 3800, 1);
    },
    whiff: function () {
      noise(0.16, 0.22, 'bandpass', 900, 0.9);
    },
    step: function () {
      noise(0.05, 0.09, 'lowpass', 400, 1);
    },
    dash: function () {
      noise(0.2, 0.2, 'bandpass', 620, 0.8);
    },
    charge: function () {
      tone(160, 0.55, 0.3, 'sawtooth', 780);
      noise(0.5, 0.18, 'bandpass', 500, 2);
    },
    superHit: function () {
      tone(120, 0.5, 0.55, 'sawtooth', 40);
      tone(300, 0.3, 0.3, 'square', 80);
      noise(0.35, 0.5, 'lowpass', 1400, 1);
    },
    projectile: function () {
      tone(520, 0.4, 0.22, 'sine', 180);
      noise(0.4, 0.16, 'bandpass', 1500, 4);
    },
    dizzy: function () {
      var base = 700;
      for (var i = 0; i < 4; i++) tone(base + i * 40, 0.22, 0.10, 'sine', base - 220, i * 0.14);
    },
    bell: function (count) {
      count = count || 1;
      for (var i = 0; i < count; i++) {
        tone(784, 0.9, 0.30, 'sine', 770, i * 0.34);
        tone(1568, 0.7, 0.16, 'sine', 1540, i * 0.34);
        tone(2350, 0.45, 0.07, 'sine', 2300, i * 0.34);
      }
    },
    ko: function () {
      tone(300, 1.2, 0.5, 'sawtooth', 40);
      tone(150, 1.6, 0.4, 'triangle', 30);
      noise(0.9, 0.4, 'lowpass', 900, 1);
      cheer(1.1);
    },
    pop: function () { // the block flying off
      tone(900, 0.18, 0.35, 'square', 1800);
      tone(300, 0.5, 0.3, 'sine', 1200);
      noise(0.2, 0.3, 'highpass', 2000, 1);
    },
    ui: function (up) {
      tone(up ? 660 : 520, 0.07, 0.2, 'square', up ? 880 : 420);
    },
    confirm: function () {
      tone(523, 0.1, 0.25, 'square');
      tone(784, 0.16, 0.22, 'square', 790, 0.07);
      tone(1046, 0.22, 0.18, 'square', 1050, 0.15);
    },
    count: function (n) {
      tone(n >= 9 ? 340 : 420, 0.28, 0.3, 'triangle', 300);
    },
    heartbeat: function () {
      tone(70, 0.16, 0.5, 'sine', 45);
      tone(70, 0.16, 0.38, 'sine', 45, 0.22);
    }
  };
  return api;
})();

/* ===== js/fighters.js ===== */
/* =========================================================================
   RIPPLE RUMBLE — roster definitions + procedural "vinyl toy" fighter art
   Every fighter is drawn with canvas paths: no image assets anywhere.
   ========================================================================= */

/* ------------------------------------------------------------ draw helpers */
function vGrad(ctx, yTop, yBot, light, base, dark) {
  var g = ctx.createLinearGradient(0, yTop, 0, yBot);
  g.addColorStop(0, light);
  g.addColorStop(0.45, base);
  g.addColorStop(1, dark);
  return g;
}
function shade(hex, amt) {
  var c = hex.replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
  g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
  b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function ell(ctx, x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
}
function fillEll(ctx, x, y, rx, ry, fill, rot) {
  ell(ctx, x, y, rx, ry, rot); ctx.fillStyle = fill; ctx.fill();
}
function outline(ctx, w, col) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
/** Two–segment limb drawn as rounded strokes (toy-plastic look). */
function limb(ctx, ax, ay, bx, by, cx, cy, w, col, dark) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
  ctx.lineWidth = w + 6; ctx.strokeStyle = dark; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
  // joint highlight
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.lineWidth = Math.max(2, w * 0.22); ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.stroke();
}
/** Ripple / XRP style four-lobe mark. */
function drawRippleMark(ctx, x, y, size, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var s = size;
  ctx.lineWidth = s * 0.30;
  ctx.beginPath();
  ctx.moveTo(-s * 0.66, -s * 0.60);
  ctx.quadraticCurveTo(0, 0, s * 0.66, s * 0.60);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s * 0.66, s * 0.60);
  ctx.quadraticCurveTo(0, 0, s * 0.66, -s * 0.60);
  ctx.stroke();
  [[-0.66, -0.60], [-0.66, 0.60], [0.66, -0.60], [0.66, 0.60]].forEach(function (p) {
    ctx.beginPath(); ctx.arc(p[0] * s, p[1] * s, s * 0.40, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

/* ------------------------------------------------------------- head pieces */
function eyeBall(ctx, x, y, rx, ry, pupilDX, pupilDY, irisCol, pupilScale) {
  fillEll(ctx, x, y, rx, ry, '#fdfdfd');
  ell(ctx, x, y, rx, ry); outline(ctx, 2.4, 'rgba(20,12,8,0.75)');

    ctx.lineTo(w, h - rr2); ctx.quadraticCurveTo(w, h, w - rr2, h);
    ctx.lineTo(-w + rr2, h); ctx.quadraticCurveTo(-w, h, -w, h - rr2);
    ctx.lineTo(-w, -h + rr2); ctx.quadraticCurveTo(-w, -h, -w + rr2, -h);
    ctx.closePath();
    ctx.fillStyle = vGrad(ctx, -h, h, '#ffffff', c.body, c.dark); ctx.fill();
    outline(ctx, 3.2, c.line);
    // visor
    ctx.beginPath();
    ctx.moveTo(-w * 0.82, -R * 0.34); ctx.lineTo(w * 0.86, -R * 0.42);
    ctx.lineTo(w * 0.86, R * 0.16); ctx.lineTo(-w * 0.82, R * 0.20); ctx.closePath();
    ctx.fillStyle = vGrad(ctx, -R * 0.5, R * 0.3, '#0b1c3a', '#0e2f6b', '#061027'); ctx.fill();
    outline(ctx, 2.6, '#0a1830');
    if (!st.ko) {
      var glow = st.rage ? '#ff7a4a' : c.accent;
      ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 18;
      [[-0.38, 0.30], [0.42, 0.26]].forEach(function (e) {
        fillEll(ctx, e[0] * R + fx, -R * 0.10, R * e[1] * (st.hurt ? 0.5 : 1), R * 0.11, glow);
      });
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(-w * 0.7, R * 0.02); ctx.lineTo(w * 0.72, R * -0.04);
      ctx.strokeStyle = 'rgba(120,200,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      [-0.38, 0.42].forEach(function (o) {
        ctx.beginPath();
        ctx.moveTo(o * R - 9, -R * 0.2); ctx.lineTo(o * R + 9, R * 0.0);
        ctx.moveTo(o * R + 9, -R * 0.2); ctx.lineTo(o * R - 9, R * 0.0);
        outline(ctx, 4, '#4b6a94');
      });

      ctx.fillRect(fx + g2 * R * 0.20 - R * 0.06, R * 0.42, R * 0.12, R * 0.34);
    }
    ctx.beginPath();
    ctx.rect(fx - R * 0.56, R * 0.38, R * 1.12, R * 0.42);
    outline(ctx, 2.4, c.line);
    // cheek vents
    ctx.strokeStyle = 'rgba(30,60,110,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w * 0.82, R * 0.42); ctx.lineTo(-w * 0.62, R * 0.42);
    ctx.moveTo(w * 0.62, R * 0.40); ctx.lineTo(w * 0.84, R * 0.40); ctx.stroke();
  }
};

/* =========================================================================
   BODY — generic vinyl-toy boxer built from the fighter's pose
   ========================================================================= */
function drawFighterBody(ctx, def, pose, st) {
  var c = def.colors, bulk = def.bulk, R = 42 * (def.headScale || 1);
  var crouch = pose.crouch * 42;
  var lean = pose.lean;
  var hipY = -104 + crouch;
  var chestY = -190 + crouch * 0.75 + pose.bob;
  var headY = -250 + crouch * 0.62 + pose.bob * 1.2 + pose.headY;
  var headX = pose.headX + lean * 1.25;

  var sw = 36 * bulk;       // shoulder half width
  var hw = 27 * bulk;       // hip half width
  var legW = 24 * bulk, armW = 21 * bulk;

  var bodyGrad = vGrad(ctx, chestY - 30, hipY + 30, c.light, c.body, c.dark);
  var legGrad = vGrad(ctx, hipY, 0, c.light, c.body, c.dark);

  /* --------- back leg + front leg (stance: back foot behind, front ahead) */
  function leg(footX, kneeOut, z) {
    var kneeBend = 14 + pose.crouch * 34;
    var kx = footX * 0.55 + kneeOut + lean * 0.25;
    var ky = hipY / 2 + 18 + pose.crouch * 10;
    var col = z === 'back' ? shade(c.body, -0.10) : c.body;
    limb(ctx, footX * 0.42 + lean * 0.5, hipY + 6, kx, ky + kneeBend, footX, -16, legW, col, c.line);
    // boot
    ctx.save();
    ctx.translate(footX, -10);
    ctx.beginPath();
    ctx.moveTo(-16, -16); ctx.lineTo(16, -16);
    ctx.quadraticCurveTo(21, -14, 22, 2);
    ctx.quadraticCurveTo(22, 10, 12, 10);
    ctx.lineTo(-16, 10); ctx.quadraticCurveTo(-22, 10, -21, 0);
    ctx.closePath();
    ctx.fillStyle = vGrad(ctx, -20, 10, shade(c.boot, 0.18), c.boot, shade(c.boot, -0.18));
    ctx.fill(); outline(ctx, 3, c.line);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-14, -13, 26, 3);
    // laces
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.6;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-6, -11 + i * 6); ctx.lineTo(8, -13 + i * 6); ctx.stroke();
    }
    ctx.restore();
  }
  leg(-34, -8, 'back');

  /* ----------------------------------------------------------- back arm */
  var shBackX = -14 * bulk + lean * 0.8, shBackY = chestY - 4;
  var bg = pose.bg;
  drawArm(ctx, shBackX, shBackY, bg.x, bg.y, armW * 0.95, shade(c.body, -0.08), c, 'back', pose);

  /* -------------------------------------------------------------- torso */
  ctx.beginPath();
  ctx.moveTo(-hw, hipY + 8);
  ctx.quadraticCurveTo(-hw - 6 * bulk, hipY - 34, -sw + lean, chestY + 10);
  ctx.quadraticCurveTo(-sw - 2 + lean, chestY - 16, -sw * 0.55 + lean, chestY - 22);
  ctx.quadraticCurveTo(0 + lean, chestY - 30, sw * 0.55 + lean, chestY - 22);
  ctx.quadraticCurveTo(sw + 2 + lean, chestY - 16, sw + lean, chestY + 10);
  ctx.quadraticCurveTo(hw + 6 * bulk, hipY - 34, hw, hipY + 8);
  ctx.closePath();
  ctx.fillStyle = bodyGrad; ctx.fill(); outline(ctx, 3.4, c.line);

  // pecs + abs sculpting
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-hw, hipY + 8);
  ctx.quadraticCurveTo(-hw - 6 * bulk, hipY - 34, -sw + lean, chestY + 10);
  ctx.quadraticCurveTo(-sw - 2 + lean, chestY - 16, -sw * 0.55 + lean, chestY - 22);
  ctx.quadraticCurveTo(0 + lean, chestY - 30, sw * 0.55 + lean, chestY - 22);
  ctx.quadraticCurveTo(sw + 2 + lean, chestY - 16, sw + lean, chestY + 10);
  ctx.quadraticCurveTo(hw + 6 * bulk, hipY - 34, hw, hipY + 8);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.20)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(lean, chestY - 18); ctx.lineTo(lean * 0.6, hipY - 6); ctx.stroke();
  if (def.abs !== false) {
    for (var a = 0; a < 3; a++) {
      var ay = chestY + 26 + a * 20;
      ctx.beginPath();
      ctx.moveTo(-20 * bulk + lean * 0.5, ay); ctx.lineTo(20 * bulk + lean * 0.5, ay - 1);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-sw * 0.85 + lean, chestY + 8);
    ctx.quadraticCurveTo(lean, chestY + 22, sw * 0.85 + lean, chestY + 8);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ell(ctx, -sw * 0.3 + lean, chestY + 6, sw * 0.42, 30); ctx.fill();
  ctx.restore();

  /* ---------------------------------------------------------- front leg */
  leg(30, 10, 'front');

  /* -------------------------------------------------------------- shorts */
  var shY = hipY - 6;
  ctx.beginPath();
  ctx.moveTo(-hw - 3, shY - 12);
  ctx.lineTo(hw + 3, shY - 12);
  ctx.quadraticCurveTo(hw + 10, shY + 30, hw + 4, shY + 52);
  ctx.lineTo(3, shY + 44);
  ctx.lineTo(-3, shY + 44);
  ctx.quadraticCurveTo(-hw - 8, shY + 52, -hw - 10, shY + 30);
  ctx.closePath();
  ctx.fillStyle = vGrad(ctx, shY - 12, shY + 52, shade(c.shorts, 0.14), c.shorts, shade(c.shorts, -0.16));
  ctx.fill(); outline(ctx, 3.2, c.line);
  // waistband
  ctx.fillStyle = c.trim;
  ctx.fillRect(-hw - 3, shY - 13, (hw + 3) * 2, 8);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.2;
  ctx.strokeRect(-hw - 3, shY - 13, (hw + 3) * 2, 8);
  // side stripe
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-hw - 3, shY - 12); ctx.lineTo(hw + 3, shY - 12);
  ctx.quadraticCurveTo(hw + 10, shY + 30, hw + 4, shY + 52);
  ctx.lineTo(3, shY + 44); ctx.lineTo(-3, shY + 44);
  ctx.quadraticCurveTo(-hw - 8, shY + 52, -hw - 10, shY + 30);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = c.trim;
  ctx.fillRect(hw - 8, shY - 12, 6, 70);
  ctx.fillRect(-hw + 2, shY - 12, 6, 70);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(-hw, shY - 4, 18, 60);
  ctx.restore();

  /* --------------------------------------------------------------- head */
  if (!st.headless) {
    ctx.save();
    ctx.translate(headX, headY);
    ctx.rotate(pose.headTilt);
    var scl = 1 + (st.rage ? 0.03 : 0);
    ctx.scale(scl, scl);
    // neck
    ctx.fillStyle = shade(c.body, -0.12);
    ctx.fillRect(-13 * bulk, R * 0.5, 26 * bulk, 42);
    HEADS[def.art](ctx, c, st, R);
    ctx.restore();
  } else {
    // the block got knocked clean off — spring-loaded stump
    ctx.save();
    ctx.translate(headX * 0.4, chestY - 26);
    ctx.fillStyle = shade(c.body, -0.18);
    ctx.fillRect(-13 * bulk, -16, 26 * bulk, 26);
    ctx.strokeStyle = c.line; ctx.lineWidth = 3;
    ctx.strokeRect(-13 * bulk, -16, 26 * bulk, 26);
    ctx.strokeStyle = '#9aa6bb'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var sp = 0; sp < 5; sp++) {
      var yy = -18 - sp * 9;
      ctx.moveTo(-9, yy); ctx.quadraticCurveTo(0, yy - 7, 9, yy - 3);
      ctx.moveTo(9, yy - 3); ctx.quadraticCurveTo(0, yy - 12, -9, yy - 9);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* --------------------------------------------------------- front arm */
  var shFrontX = 18 * bulk + lean * 0.9, shFrontY = chestY - 2;
  drawArm(ctx, shFrontX, shFrontY, pose.fg.x, pose.fg.y, armW, c.body, c, 'front', pose);
}

function drawArm(ctx, sx, sy, gx, gy, w, col, c, which, pose) {
  // elbow: pushed outward/downward from the shoulder-glove midpoint
  var mx = (sx + gx) / 2, my = (sy + gy) / 2;
  var dx = gx - sx, dy = gy - sy;
  var len = Math.hypot(dx, dy) || 1;
  var nx = -dy / len, ny = dx / len;
  var slack = Math.max(0, 108 - len) * 0.42;
  var ex = mx - nx * slack * 0.5 + 4, ey = my + Math.abs(ny) * slack * 0.5 + slack * 0.35;
  limb(ctx, sx, sy, ex, ey, gx, gy, w, col, c.line);
  // shoulder cap
  fillEll(ctx, sx, sy, w * 0.72, w * 0.72, col);
  ell(ctx, sx, sy, w * 0.72, w * 0.72); outline(ctx, 2.6, c.line);
  fillEll(ctx, sx - w * 0.2, sy - w * 0.25, w * 0.28, w * 0.22, 'rgba(255,255,255,0.18)');
  // glove
  var gr = 22 * (c.gloveScale || 1);
  ctx.save();
  ctx.translate(gx, gy);
  var ang = Math.atan2(dy, dx);
  ctx.rotate(ang * 0.35);
  // cuff
  ctx.fillStyle = shade(c.glove, -0.2);
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-gr * 0.95, -gr * 0.5, gr * 0.7, gr, 5) : ctx.rect(-gr * 0.95, -gr * 0.5, gr * 0.7, gr);
  ctx.fill(); outline(ctx, 2.4, c.line);
  // mitt
  ell(ctx, 0, 0, gr, gr * 0.94);
  ctx.fillStyle = vGrad(ctx, -gr, gr, shade(c.glove, 0.22), c.glove, shade(c.glove, -0.2));
  ctx.fill(); outline(ctx, 3, c.line);
  // thumb
  fillEll(ctx, -gr * 0.25, gr * 0.62, gr * 0.42, gr * 0.3, shade(c.glove, 0.06), 0.4);
  ell(ctx, -gr * 0.25, gr * 0.62, gr * 0.42, gr * 0.3, 0.4); outline(ctx, 2.2, c.line);
  // knuckle crease + shine
  ctx.beginPath();
  ctx.moveTo(gr * 0.30, -gr * 0.55); ctx.quadraticCurveTo(gr * 0.62, 0, gr * 0.30, gr * 0.55);
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 2.4; ctx.stroke();
  fillEll(ctx, -gr * 0.18, -gr * 0.42, gr * 0.36, gr * 0.22, 'rgba(255,255,255,0.35)', -0.3);
  ctx.restore();
}

/* Full fighter render: shadow, body, and status FX. */
function drawFighter(ctx, def, pose, st, x, y, facing, scale) {
  ctx.save();
  ctx.translate(x, y);
  // ground shadow
  ctx.save();
  ctx.scale(1, 1);
  fillEll(ctx, 0, 4, 58 * scale, 15 * scale, 'rgba(0,0,0,0.38)');
  ctx.restore();
  ctx.scale(facing * scale, scale);
  if (st.flash > 0) { ctx.save(); }
  drawFighterBody(ctx, def, pose, st);
  if (st.flash > 0) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.62 * st.flash) + ')';
    ctx.fillRect(-200, -340, 400, 360);
    ctx.restore();
  }
  ctx.restore();
}

/* ------------------------------------------------------------ small math */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function approach(cur, target, rate, dt) { return lerp(cur, target, 1 - Math.pow(1 - rate, dt * 60)); }
function bez(p, p0, c, p1) {
  var m = 1 - p;
  return {
    x: m * m * p0[0] + 2 * m * p * c[0] + p * p * p1[0],
    y: m * m * p0[1] + 2 * m * p * c[1] + p * p * p1[1]
  };
}
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t; }

function buildAttacks(def) {
  var s = def.stats;
  var tm = 1.24 - 0.24 * s.speed;          // timing multiplier (lower = faster)
  var pw = s.power;
  function A(o) {
    o.startup *= tm; o.active *= tm; o.recovery *= tm;
    o.dmg *= pw;
    o.total = o.startup + o.active + o.recovery;
    return o;
  }
  return {
    jab: A({
      key: 'jab', label: 'JAB', arm: 'front', height: 'head',
      startup: 0.085, active: 0.075, recovery: 0.145,
      dmg: 4.4, stun: 10, reach: 112, push: 55, stam: 5, meter: 5, weight: 0.18,
      p1: [134, -198], ctl: [88, -206]
    }),
    hook: A({
      key: 'hook', label: 'HOOK', arm: 'back', height: 'head',
      startup: 0.205, active: 0.095, recovery: 0.315,
      dmg: 11.5, stun: 27, reach: 104, push: 190, stam: 15, meter: 9, weight: 0.85,
      p1: [122, -192], ctl: [52, -262]
    }),
    body: A({
      key: 'body', label: 'BODY', arm: 'front', height: 'body',
      startup: 0.135, active: 0.085, recovery: 0.255,
      dmg: 7.2, stun: 15, reach: 100, push: 105, stam: 10, meter: 7, weight: 0.5,
      stamDmg: 30, p1: [124, -152], ctl: [66, -182]
    })
  };
}

/* ========================================================================= */
function Fighter(def, side, isCPU) {
  this.def = def;
  this.side = side;                 // -1 left corner, +1 right corner
  this.isCPU = !!isCPU;
  this.attacks = buildAttacks(def);
  this.pose = {
    fg: { x: GUARD_FG[0], y: GUARD_FG[1] },
    bg: { x: GUARD_BG[0], y: GUARD_BG[1] },
    crouch: 0, lean: 0, headY: 0, headX: 0, headTilt: 0, bob: 0
  };
  this.st = { flash: 0, hurt: 0, dizzy: false, ko: false, mouth: 0, rage: false, t: 0 };
  this.in = {};
  this.resetMatch();
}

Fighter.prototype.resetMatch = function () {
  this.wins = 0;
  this.resetRound();
};

Fighter.prototype.resetRound = function () {
  var s = this.def.stats;
  this.hp = this.maxHp = s.hp;
  this.stam = this.maxStam = s.stamina;
  this.meter = 0;
  this.stun = 0;
  this.x = this.side < 0 ? RING.left + 175 : RING.right - 175;
  this.vx = 0;
  this.facing = -this.side;
  this.state = 'idle';
  this.t = 0; this.dur = 0;
  this.atk = null; this.atkHit = false; this.multiHitT = 0; this.multiHits = 0;
  this.iframes = 0; this.blockTime = 0; this.armor = 0;
  this.hitFlash = 0; this.noHitTime = 0; this.stunDecay = 0;
  this.combo = 0; this.comboT = 0;
  this.downs = 0; this.buff = 0; this.grabbing = null;
  this.bobT = Math.random() * 6;
  this.headPop = null;
  this.lastDamageFrom = 0;
  this.downT = 0; this.getUp = 0; this.downFinal = false;
  // wipe knockout dressing so round two starts with a head on
  this.st.headless = false; this.st.ko = false; this.st.rage = false;
  this.st.flash = 0; this.st.hurt = false; this.st.dizzy = false; this.st.mouth = 0;
  this.pose.fg.x = GUARD_FG[0]; this.pose.fg.y = GUARD_FG[1];
  this.pose.bg.x = GUARD_BG[0]; this.pose.bg.y = GUARD_BG[1];
  this.pose.crouch = 0; this.pose.lean = 0;
  this.pose.headY = 0; this.pose.headX = 0; this.pose.headTilt = 0;
};

Fighter.prototype.canAct = function () {
  return this.state === 'idle' || this.state === 'walk' || this.state === 'block' || this.state === 'duck';
};
Fighter.prototype.isBusy = function () {
  return !this.canAct();
};
Fighter.prototype.setState = function (s, dur) {
  this.state = s; this.t = 0; this.dur = dur || 0;
};

Fighter.prototype.damageScale = function () {
  var m = 1;
  if (this.def.id === 'riptide') m *= 1 + 0.40 * (1 - this.hp / this.maxHp);     // RAGE
  if (this.buff > 0) m *= 1.25;
  return m;
};
Fighter.prototype.speedScale = function () {
  var m = this.def.stats.speed;
  if (this.buff > 0) m *= 1.35;
  if (this.stam <= 0) m *= 0.65;
  return m;
};

/* ------------------------------------------------------------------ input */
Fighter.prototype.tryAttack = function (key) {
  var a = this.attacks[key];
  if (!a) return false;
  if (!this.canAct()) return false;
  if (this.stam < a.stam) { if (key !== 'jab') return false; }
  this.atk = a; this.atkHit = false;
  this.stam = Math.max(0, this.stam - a.stam);
  this.setState('attack', a.total * (this.buff > 0 ? 0.78 : 1));
  SFX.whiff();
  return true;
};

Fighter.prototype.trySpecial = function () {
  if (this.meter < 100 || !this.canAct()) return false;
  this.meter = 0;
  this.atk = null; this.atkHit = false; this.multiHits = 0; this.multiHitT = 0;
  var dur = { bruiser: 1.20, hare: 1.55, lobo: 1.45, riptide: 0.70, ledger: 0.95 }[this.def.id] || 1.1;
  this.setState('special', dur);
  SFX.charge();
  if (window.NET) NET.event(4, this.x, RING.floorY - 200, 1);
  GameRef.announce(this.def.special.name + '!', this.side, this.def.colors.accent);
  GameRef.flash(0.55, this.def.colors.accent);
  GameRef.shake(10);
  return true;
};

Fighter.prototype.tryDash = function (dir) {
  if (!this.canAct() || this.stam < 12) return false;
  this.stam -= 12;
  this.dashDir = dir;
  this.setState('dodge', this.def.id === 'hare' ? 0.30 : 0.26);
  this.iframes = this.def.id === 'hare' ? 0.26 : 0.17;
  SFX.dash();
  GameRef.fx.dust(this.x, RING.floorY, -dir);
  return true;
};

/* ----------------------------------------------------------------- update */
Fighter.prototype.update = function (dt, opp) {
  var i = this.in;
  this.st.t += dt;
  this.bobT += dt;
  this.iframes = Math.max(0, this.iframes - dt);
  this.hitFlash = Math.max(0, this.hitFlash - dt * 4);
  this.st.flash = this.hitFlash;
  this.armor = Math.max(0, this.armor - dt);
  this.comboT = Math.max(0, this.comboT - dt);
  if (this.comboT <= 0) this.combo = 0;
  this.noHitTime += dt;
  this.buff = Math.max(0, this.buff - dt);
  this.st.rage = this.buff > 0;
  this.st.hurt = this.hp / this.maxHp < 0.34;
  this.st.dizzy = this.state === 'dizzy';

  // stun decay
  if (this.noHitTime > 0.75) this.stun = Math.max(0, this.stun - 20 * dt);

  // stamina
  var regen = this.state === 'attack' || this.state === 'special' ? 0
    : this.state === 'block' ? 9 : (this.state === 'idle' ? 20 : 14);
  this.stam = clamp(this.stam + regen * dt, 0, this.maxStam);

  // meter drift from aggression is granted on hits; passive trickle keeps pace
  this.meter = clamp(this.meter + 1.6 * dt * this.def.stats.meterRate, 0, 100);

  // LEDGER passive: auto-settle repair
  if (this.def.id === 'ledger' && this.noHitTime > 3 && this.hp > 0) {
    this.hp = Math.min(this.maxHp, this.hp + 2 * dt);
  }

  this.t += dt;

  switch (this.state) {
    case 'idle': case 'walk': case 'block': case 'duck': this.updateFree(dt, opp); break;
    case 'attack': this.updateAttack(dt, opp); break;
    case 'special': this.updateSpecial(dt, opp); break;
    case 'dodge':
      this.vx = this.dashDir * 540 * (0.85 + this.def.stats.speed * 0.2);
      if (this.t >= this.dur) this.setState('idle');
      break;
    case 'hitstun': case 'hitstunBody':
      this.vx *= Math.pow(0.02, dt);
      if (this.t >= this.dur) this.setState('idle');
      break;
    case 'dizzy':
      this.vx *= Math.pow(0.05, dt);
      if (this.t >= this.dur) { this.setState('idle'); this.stun = 0; }
      break;
    case 'exhaust':
      this.vx *= Math.pow(0.05, dt);
      if (this.t >= this.dur) { this.setState('idle'); this.stam = this.maxStam * 0.3; }
      break;
    case 'grabbed':
      this.vx = 0;
      if (this.t >= this.dur) this.setState('hitstun', 0.25);
      break;
    case 'down': this.updateDown(dt); break;
    case 'ko': this.vx *= Math.pow(0.1, dt); break;
    case 'win': this.vx = 0; break;
  }

  // integrate
  this.x += this.vx * dt;
  this.x = clamp(this.x, RING.left, RING.right);

  this.updatePose(dt, opp);
};

Fighter.prototype.updateFree = function (dt, opp) {
  var i = this.in;
  if (this.stam <= 0 && this.state !== 'exhaust') {
    this.setState('exhaust', 1.1);
    GameRef.announce('OUT OF GAS!', this.side, '#ffb347');
    return;
  }
  // specials / attacks
  if (i.special && this.trySpecial()) return;
  if (i.dash) { if (this.tryDash(i.dash)) return; }
  if (i.jab && this.tryAttack('jab')) return;
  if (i.hook && this.tryAttack('hook')) return;
  if (i.body && this.tryAttack('body')) return;

  if (i.duck) {
    if (this.state !== 'duck') this.setState('duck');
    this.vx = 0;
    return;
  }
  if (i.block) {
    if (this.state !== 'block') { this.setState('block'); this.blockTime = 0; }
    this.blockTime += dt;
    this.vx = 0;
    return;
  }

  var spd = 196 * this.speedScale();
  var dir = (i.right ? 1 : 0) - (i.left ? 1 : 0);
  if (dir !== 0) {
    var back = (dir === -this.facing);
    this.vx = dir * spd * (back ? 0.82 : 1);
    if (this.state !== 'walk') this.setState('walk');
    this.walkPhase = (this.walkPhase || 0) + dt * 7;
    if (Math.sin(this.walkPhase) > 0.98) SFX.step();
  } else {
    this.vx = 0;
    if (this.state !== 'idle') this.setState('idle');
  }
};

Fighter.prototype.updateAttack = function (dt, opp) {
  var a = this.atk;
  if (!a) { this.setState('idle'); return; }
  var scale = this.buff > 0 ? 0.78 : 1;
  var su = a.startup * scale, ac = a.active * scale;
  this.vx *= Math.pow(0.02, dt);
  // step-in on heavy punches
  if (this.t < su && a.key !== 'jab') this.vx = this.facing * 55;
  // bear armour on hook startup
  if (this.def.id === 'bruiser' && a.key === 'hook' && this.t < su) this.armor = 0.05;

  if (this.t >= su && this.t < su + ac && !this.atkHit) {
    if (GameRef.tryHit(this, opp, a)) this.atkHit = true;
  }
  if (this.t >= this.dur) { this.atk = null; this.setState('idle'); }
};

/* -------------------------------------------------------------- specials */
Fighter.prototype.updateSpecial = function (dt, opp) {
  var id = this.def.id, p = this.t / this.dur;
  this.vx *= Math.pow(0.1, dt);

  if (id === 'bruiser') {
    if (this.t > 0.42 && this.t < 0.60) this.vx = this.facing * 230;
    if (this.t >= 0.52 && this.t < 0.66 && !this.atkHit) {
      var a = {
        key: 'crown', label: 'CROWN CRUSHER', height: 'head', arm: 'back',
        dmg: 30 * this.def.stats.power, stun: 55, reach: 128, push: 300,
        meter: 0, weight: 1, guardBreak: true, superMove: true
      };
      if (GameRef.tryHit(this, opp, a)) this.atkHit = true;
    }
    if (this.t > 0.60 && this.t < 0.63) { GameRef.shake(26); GameRef.fx.shock(this.x + this.facing * 70, RING.floorY, this.def.colors.accent); }
  }
  else if (id === 'hare') {
    if (this.t < 0.22) {
      var d = opp.x - this.x;
      if (Math.abs(d) > 120) this.vx = Math.sign(d) * 720;
    } else if (this.t < 1.05) {
      this.multiHitT -= dt;
      if (this.multiHitT <= 0 && this.multiHits < 8) {
        this.multiHitT = 0.085;
        this.multiHits++;
        GameRef.tryHit(this, opp, {
          key: 'flurry', label: 'FLURRY', height: this.multiHits % 3 === 0 ? 'body' : 'head',
          arm: this.multiHits % 2 ? 'front' : 'back',
          dmg: 3.1 * this.def.stats.power, stun: 7, reach: 126, push: 14,
          meter: 0, weight: 0.22, superMove: true, noBlockPush: true
        });
      }
    } else if (this.t >= 1.08 && this.t < 1.22 && !this.atkHit) {
      if (GameRef.tryHit(this, opp, {
        key: 'harefin', label: 'HARE TRIGGER', height: 'head', arm: 'back',
        dmg: 10 * this.def.stats.power, stun: 40, reach: 124, push: 320,
        meter: 0, weight: 0.95, superMove: true
      })) { this.atkHit = true; GameRef.shake(20); }
    }
  }
  else if (id === 'lobo') {
    if (this.t < 0.42 && !this.grabbing) {
      var dd = opp.x - this.x;
      this.vx = Math.sign(dd) * 640;
      if (Math.abs(dd) < 108) {
        if (opp.iframes > 0 || opp.state === 'dodge') {
          GameRef.announce('WHIFF!', opp.side, '#9fe8ff');
        } else {
          this.grabbing = opp;
          opp.setState('grabbed', 0.62);
          opp.vx = 0;
          SFX.hit(0.4);
        }
      }
    }
    if (this.grabbing) {
      this.vx = 0;
      var o = this.grabbing;
      o.x = this.x + this.facing * 64;
      if (this.t >= 0.72 && !this.atkHit) {
        this.atkHit = true;
        GameRef.applyDamage(this, o, {
          key: 'slam', label: 'LUCHA SLAM', height: 'body', dmg: 26 * this.def.stats.power,
          stun: 60, push: 250, weight: 1, superMove: true, unblockable: true
        }, 'slam');
        GameRef.shake(30);
        GameRef.fx.shock(o.x, RING.floorY, this.def.colors.accent);
        SFX.superHit();
        this.grabbing = null;
      }
    }
  }
  else if (id === 'riptide') {
    if (this.t > 0.3 && this.buff <= 0) {
      this.buff = 6.0;
      GameRef.announce('FERAL FRENZY!', this.side, '#ff6a3d');
      SFX.cheer(0.9);
    }
    GameRef.fx.rage(this.x, RING.floorY - 150, this.def.colors.accent);
  }
  else if (id === 'ledger') {
    if (this.t >= 0.38 && !this.atkHit) {
      this.atkHit = true;
      GameRef.spawnProjectile(this);
      SFX.projectile();
    }
  }

  if (this.t >= this.dur) {
    this.grabbing = null;
    this.atk = null;
    this.setState('idle');
  }
};

/* -------------------------------------------------------- online: guest
   The guest never simulates combat — the host's snapshot is the truth. This
   advances only what is cosmetic, so animation stays smooth at 60fps between
   snapshots that arrive ~30 times a second. */
Fighter.prototype.netVisual = function (dt, opp) {
  this.st.t += dt;
  this.bobT += dt;
  this.t += dt;                                   // let attack timelines keep playing
  this.hitFlash = Math.max(0, this.hitFlash - dt * 4);
  this.st.flash = this.hitFlash;
  this.comboT = Math.max(0, this.comboT - dt);
  this.st.rage = this.buff > 0;
  this.st.hurt = this.hp / this.maxHp < 0.34;
  this.st.dizzy = this.state === 'dizzy';
  if (this.state === 'down' || this.state === 'ko') this.downT = (this.downT || 0) + dt;
  else this.downT = 0;
  if (this.netX !== undefined) this.x = approach(this.x, this.netX, 0.4, dt);
  this.updatePose(dt, opp);
};

/* ------------------------------------------------------------ knockdowns */
Fighter.prototype.goDown = function (final) {
  this.setState('down', final ? 9999 : 0);
  this.downFinal = !!final;
  this.downT = 0;
  this.getUp = 0;
  this.vx = -this.facing * 190;
  this.st.ko = true;
  this.combo = 0;
};
Fighter.prototype.updateDown = function (dt) {
  this.vx *= Math.pow(0.04, dt);
  this.downT += dt;
};

/* ------------------------------------------------------------------ pose */
Fighter.prototype.updatePose = function (dt, opp) {
  var P = this.pose, tgt = null, rate = 0.32;
  var breathe = Math.sin(this.bobT * 2.6) * 2.2;
  P.bob = approach(P.bob, breathe, 0.2, dt);
  this.st.mouth = clamp((this.state === 'attack' ? 0.6 : 0) + (this.buff > 0 ? 0.5 : 0), 0, 1);

  if (this.state === 'attack' || (this.state === 'special' && this.def.id !== 'riptide')) {
    this.posePunch(dt);
    return;
  }
  switch (this.state) {
    case 'idle': tgt = POSES.idle; break;
    case 'walk': tgt = (Math.sign(this.vx) === this.facing) ? POSES.walkF : POSES.walkB; break;
    case 'block': tgt = POSES.block; rate = 0.5; break;
    case 'duck': tgt = POSES.duck; rate = 0.5; break;
    case 'dodge': tgt = POSES.dodge; rate = 0.5; break;
    case 'hitstun': tgt = POSES.hit; rate = 0.6; break;
    case 'hitstunBody': tgt = POSES.hitBody; rate = 0.6; break;
    case 'dizzy': tgt = POSES.dizzy; rate = 0.2; break;
    case 'exhaust': tgt = POSES.exhaust; rate = 0.2; break;
    case 'grabbed': tgt = POSES.grabbed; rate = 0.5; break;
    case 'win': tgt = POSES.win; rate = 0.16; break;
    case 'special': tgt = POSES.charge; rate = 0.35; break;
    case 'down': this.poseDown(dt); return;
    case 'ko': this.poseDown(dt); return;
    default: tgt = POSES.idle;
  }
  P.fg.x = approach(P.fg.x, tgt.fg[0], rate, dt);
  P.fg.y = approach(P.fg.y, tgt.fg[1], rate, dt);
  P.bg.x = approach(P.bg.x, tgt.bg[0], rate, dt);
  P.bg.y = approach(P.bg.y, tgt.bg[1], rate, dt);
  P.crouch = approach(P.crouch, tgt.crouch, rate, dt);
  P.lean = approach(P.lean, tgt.lean, rate, dt);
  P.headY = approach(P.headY, tgt.headY, rate, dt);
  P.headX = approach(P.headX, 0, rate, dt);
  var tilt = tgt.tilt;
  if (this.state === 'dizzy') { tilt = Math.sin(this.t * 7) * 0.26; P.headX = Math.sin(this.t * 7) * 9; }
  if (this.state === 'win') tilt = Math.sin(this.t * 4) * 0.12;
  P.headTilt = approach(P.headTilt, tilt, rate, dt);
};

Fighter.prototype.posePunch = function (dt) {
  var P = this.pose;
  var a = this.atk;
  var scale = this.buff > 0 ? 0.78 : 1;
  var p, arm = 'front', p1, ctl, lean = 8, crouch = 0.05;

  if (this.state === 'special') {
    var id = this.def.id, tt = this.t;
    if (id === 'bruiser') {
      arm = 'back';
      if (tt < 0.42) { p = easeOut(tt / 0.42) * 0.35; p1 = [10, -330]; ctl = [-30, -270]; lean = -12; }
      else { p = clamp((tt - 0.42) / 0.20, 0, 1); p1 = [118, -120]; ctl = [90, -330]; lean = 18; crouch = 0.35; }
      var src = tt < 0.42 ? [GUARD_BG[0], GUARD_BG[1]] : [10, -330];
      var pt = bez(tt < 0.42 ? easeOut(tt / 0.42) : easeIn(clamp((tt - 0.42) / 0.20, 0, 1)), src, ctl, p1);
      P.bg.x = pt.x; P.bg.y = pt.y;
      P.fg.x = approach(P.fg.x, 30, 0.3, dt); P.fg.y = approach(P.fg.y, -230, 0.3, dt);
    } else if (id === 'hare') {
      var f = (this.multiHits % 2) === 1;
      var ph = (this.multiHitT / 0.085);
      var ext = this.t < 0.22 ? 0.2 : (this.t > 1.05 ? 1 : 1 - Math.abs(ph - 0.5) * 1.4);
      var e = clamp(ext, 0, 1);
      P.fg.x = lerp(GUARD_FG[0], 130, f ? e : e * 0.3);
      P.fg.y = lerp(GUARD_FG[1], -196, 1);
      P.bg.x = lerp(GUARD_BG[0], 126, f ? e * 0.3 : e);
      P.bg.y = lerp(GUARD_BG[1], -200, 1);
      lean = 14;
    } else if (id === 'lobo') {
      var gp = clamp(this.t / 0.4, 0, 1);
      if (this.grabbing) {
        P.fg.x = 78; P.fg.y = -210 + Math.sin(this.t * 14) * 8;
        P.bg.x = 62; P.bg.y = -196;
        lean = 16; crouch = 0.25;
      } else {
        P.fg.x = lerp(GUARD_FG[0], 120, gp); P.fg.y = lerp(GUARD_FG[1], -214, gp);
        P.bg.x = lerp(GUARD_BG[0], 104, gp); P.bg.y = lerp(GUARD_BG[1], -222, gp);
        lean = 18;
      }
    } else if (id === 'ledger') {
      var lp = clamp(this.t / 0.4, 0, 1);
      P.fg.x = lerp(GUARD_FG[0], 108, lp); P.fg.y = lerp(GUARD_FG[1], -186, lp);
      P.bg.x = lerp(GUARD_BG[0], 92, lp); P.bg.y = lerp(GUARD_BG[1], -190, lp);
      lean = 6;
    }
    P.crouch = approach(P.crouch, crouch, 0.3, dt);
    P.lean = approach(P.lean, lean, 0.3, dt);
    P.headY = approach(P.headY, 0, 0.3, dt);
    P.headX = approach(P.headX, 0, 0.3, dt);
    P.headTilt = approach(P.headTilt, -0.06, 0.3, dt);
    return;
  }

  // normal attack timeline
  var su = a.startup * scale, ac = a.active * scale, rc = a.recovery * scale;
  var tt2 = this.t, prog;
  if (tt2 < su) prog = -0.18 * Math.sin((tt2 / su) * Math.PI * 0.5);            // wind up
  else if (tt2 < su + ac) prog = easeOut(clamp((tt2 - su) / (ac * 0.45), 0, 1)); // strike
  else prog = 1 - easeIn(clamp((tt2 - su - ac) / rc, 0, 1));                     // recover

  var start = a.arm === 'front' ? GUARD_FG : GUARD_BG;
  var windup = a.arm === 'front' ? [start[0] - 14, start[1] - 4] : [start[0] - 22, start[1] - 10];
  var pt2;
  if (prog < 0) pt2 = { x: lerp(start[0], windup[0], -prog / 0.18), y: lerp(start[1], windup[1], -prog / 0.18) };
  else pt2 = bez(prog, start, a.ctl, a.p1);

  if (a.arm === 'front') {
    P.fg.x = pt2.x; P.fg.y = pt2.y;
    P.bg.x = approach(P.bg.x, GUARD_BG[0] + 6, 0.3, dt);
    P.bg.y = approach(P.bg.y, GUARD_BG[1] - 2, 0.3, dt);
  } else {
    P.bg.x = pt2.x; P.bg.y = pt2.y;
    P.fg.x = approach(P.fg.x, GUARD_FG[0] - 6, 0.3, dt);
    P.fg.y = approach(P.fg.y, GUARD_FG[1] - 6, 0.3, dt);
  }
  var amt = clamp(prog, 0, 1);
  P.lean = approach(P.lean, lerp(-4, a.key === 'body' ? 20 : 13, amt), 0.45, dt);
  P.crouch = approach(P.crouch, a.key === 'body' ? 0.30 * amt : 0.06 * amt, 0.4, dt);
  P.headX = approach(P.headX, amt * (a.key === 'body' ? 4 : 8), 0.4, dt);
  P.headY = approach(P.headY, a.key === 'body' ? amt * 6 : 0, 0.4, dt);
  P.headTilt = approach(P.headTilt, amt * (a.key === 'hook' ? 0.16 : 0.07), 0.4, dt);
};

Fighter.prototype.poseDown = function (dt) {
  var P = this.pose;
  P.fg.x = approach(P.fg.x, 40, 0.14, dt);
  P.fg.y = approach(P.fg.y, -60, 0.14, dt);
  P.bg.x = approach(P.bg.x, -20, 0.14, dt);
  P.bg.y = approach(P.bg.y, -60, 0.14, dt);
  P.crouch = approach(P.crouch, 1, 0.12, dt);
  P.lean = approach(P.lean, -12, 0.12, dt);
  P.headTilt = approach(P.headTilt, -0.5, 0.1, dt);
};

/* =========================================================================
   AI — reads the fight and drives the same input struct a human would
   ========================================================================= */
function AI(fighter, profile, level) {
  this.f = fighter;
  this.p = profile;
  this.level = level || 1;         // 0.6 easy … 1.4 brutal
  this.decideT = 0;
  this.plan = 'approach';
  this.planT = 0;
  this.reactT = 0;
  this.lastOppState = '';
}

AI.prototype.think = function (dt, opp) {
  var f = this.f, i = f.in, p = this.p, L = this.level;
  i.left = i.right = i.block = i.duck = false;
  i.jab = i.hook = i.body = i.special = false; i.dash = 0;

  if (f.state === 'down' || f.state === 'ko' || f.state === 'win') {
    // mash to rise
    if (f.state === 'down' && !f.downFinal) f.getUp = Math.min(1, f.getUp + dt * (0.34 + 0.22 * L));
    return;
  }
  if (f.isBusy() && f.state !== 'block' && f.state !== 'duck') return;

  var dist = Math.abs(opp.x - f.x);
  var dir = Math.sign(opp.x - f.x) || 1;
  var idealRange = 104 * p.spacing;
  this.decideT -= dt;
  this.reactT -= dt;

  /* ---- reactive defence: respond to the opponent's startup frames ---- */
  var threat = (opp.state === 'attack' && opp.atk && opp.t < opp.atk.startup * 1.15) ||
    (opp.state === 'special' && opp.t < 0.4);
  var inRange = dist < 132;

  if (threat && inRange && this.reactT <= 0) {
    this.reactT = 0.18 / L;
    var r = Math.random();
    var superThreat = opp.state === 'special';
    if (superThreat && r < p.dodge * L * 1.3) { i.dash = -dir; return; }
    if (r < p.block * L * 0.85) {
      if (opp.atk && opp.atk.height === 'body') { i.block = true; }
      else if (r < p.dodge * L * 0.6) { i.duck = true; }
      else i.block = true;
      return;
    }
    if (r < (p.block + p.dodge) * L * 0.8) { i.dash = -dir; return; }
  }

  /* ---- punish windows ---- */
  var oppRecovering = (opp.state === 'attack' && opp.atk && opp.t > opp.atk.startup + opp.atk.active) ||
    opp.state === 'dizzy' || opp.state === 'exhaust' || opp.state === 'hitstun' || opp.state === 'grabbed';

  if (f.meter >= 100 && Math.random() < p.special * L &&
    (dist < 150 || f.def.id === 'ledger' || f.def.id === 'lobo') &&
    (oppRecovering || Math.random() < 0.35)) {
    i.special = true; return;
  }

  if (this.decideT <= 0) {
    this.decideT = (0.16 + Math.random() * 0.24) / L;
    if (oppRecovering && dist < 130) this.plan = 'punish';
    else if (dist > idealRange + 40) this.plan = 'approach';
    else if (dist < idealRange - 42) this.plan = Math.random() < 0.35 ? 'retreat' : 'attack';
    else this.plan = Math.random() < p.aggression * L ? 'attack' : (Math.random() < 0.4 ? 'circle' : 'guard');
    this.planT = 0.25 + Math.random() * 0.4;
  }
  this.planT -= dt;

  switch (this.plan) {
    case 'approach':
      if (dir > 0) i.right = true; else i.left = true;
      if (dist > 300 && Math.random() < 0.02 * L) i.dash = dir;
      break;
    case 'retreat':
      if (dir > 0) i.left = true; else i.right = true;
      break;
    case 'circle':
      if (Math.random() < 0.5) { if (dir > 0) i.left = true; else i.right = true; }
      else { if (dir > 0) i.right = true; else i.left = true; }
      break;
    case 'guard':
      i.block = true;
      break;
    case 'punish':
      if (dist > 118) { if (dir > 0) i.right = true; else i.left = true; }
      else {
        if (opp.state === 'dizzy' || opp.state === 'down') i.hook = true;
        else if (Math.random() < 0.5) i.hook = true; else i.body = true;
      }
      break;
    case 'attack':
      if (dist > 122) { if (dir > 0) i.right = true; else i.left = true; break; }
      var roll = Math.random();
      if (opp.state === 'block') {
        // beat the guard with body shots
        if (roll < 0.55) i.body = true;
        else if (roll < 0.7) i.hook = true;
        else { if (dir > 0) i.left = true; else i.right = true; }
      } else if (opp.state === 'duck') {
        if (roll < 0.6) i.body = true; else i.jab = true;
      } else {
        if (roll < 0.42) i.jab = true;
        else if (roll < 0.66) i.body = true;
        else if (roll < 0.86) i.hook = true;
        else i.block = true;
      }
      break;
  }
  // stamina discipline
  if (f.stam < 25 && (i.hook || i.body)) { i.hook = i.body = false; i.block = Math.random() < 0.6; }
};

/* =========================================================================
   RIPPLE RUMBLE — online play

   Transport: whatever this page can reach.
     · "room"  — the Artifact runtime's room capability (published link).
                 High-rate state rides on PRESENCE, which every admitted
                 viewer may set; event topics are admin-only, so we use none.
     · "local" — BroadcastChannel, for two windows of the same browser.

   Model: host-authoritative. The host simulates the whole fight and
   publishes an absolute snapshot ~30x/s; the guest publishes its input and
   renders what it is told. Presence is coalesced and lossy by design, so
   everything sent is absolute state, and one-shot moments (a punch landing)
   ride along as a short ring buffer of numbered events.
   ========================================================================= */
var NET = (function () {

  /* --------------------------------------------------------- handle names */
  var ADJ = ['IRON', 'NIGHT', 'RED', 'STEEL', 'WILD', 'GOLD', 'STORM', 'QUICK', 'MAD', 'GRIM', 'NEON', 'STONE'];
  var NOUN = ['GLOVE', 'HAMMER', 'FANG', 'JAB', 'HOOK', 'CROWN', 'BOLT', 'CLAW', 'ANVIL', 'RIPPER', 'COMET', 'PAW'];
  function randomHandle() {
    return ADJ[(Math.random() * ADJ.length) | 0] + ' ' + NOUN[(Math.random() * NOUN.length) | 0];
  }
  var CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function randomCode() {
    var s = '';

    return s;
  }

  /* ===================================================== transport: room  */
  function wrapRoom(r, lobbyNs) {
    return {
      kind: 'room',
      ns: r,
      lobbyNs: lobbyNs || r,
      setPresence: function (o) {
        try {
          return r.presence(o).catch(function (e) {
            // surface the first refusal so the lobby can say what is wrong
            if (e && e.code && !S.error) S.error = String(e.code);
          });
        } catch (e) { return Promise.resolve(); }
      },
      peers: function () {
        var out = [];

          var ps = r.peers();

            var p = ps[i];
            if (p.kind === 'agent') continue;            // the publishing session is not a player
            out.push({ id: p.peer, isMe: !!p.isMe, sameTab: !!p.sameTab, pr: p.presence || {} });

        return out;
      },
      onPeers: function (cb) { try { return r.onPeers(function () { cb(); }, function () { }); } catch (e) { return function () { }; } },
      connected: function () { try { return r.connected(); } catch (e) { return false; } },
      join: function (name) {
        return (lobbyNs || r).join(name).then(function (nr) { return wrapRoom(nr, lobbyNs || r); });
      },
      leave: function () { try { return r.leave ? r.leave() : Promise.resolve(); } catch (e) { return Promise.resolve(); } }
    };
  }

  /* ===================================================== transport: relay
     A plain WebSocket to our own tiny Cloudflare Worker. Preferred on office
     networks, which routinely block peer-to-peer UDP but never block wss.
     Protocol (mirrors the presence model exactly):
       out  {t:'p', pr}                     set my presence
       in   {t:'init', id, peers:{id:pr}}   who is here, and who I am
       in   {t:'p', id, pr} / {t:'bye', id}

    var dead = false, tries = 0, pingTimer = null, retryTimer = null;

    function fire() { for (var i = 0; i < subs.length; i++) try { subs[i](); } catch (e) { } }

      if (dead) return;

        clearInterval(pingTimer);
        pingTimer = setInterval(function () {
          if (open) try { ws.send(JSON.stringify({ t: 'ping' })); } catch (e) { }
        }, 10000);   // keep the socket warm; idle sockets were dropping

          if (m.id === myId) return;

      kind: 'relay',
      setPresence: function (o) {
        for (var k in o) { if (o[k] === null) delete mine[k]; else mine[k] = o[k]; }
        if (open) try { ws.send(JSON.stringify({ t: 'p', pr: mine })); } catch (e) { }
        return Promise.resolve();
      },
      peers: function () {
        var out = [{ id: myId || 'me', isMe: true, sameTab: true, pr: mine }];
        for (var k in others) out.push({ id: k, isMe: false, sameTab: false, pr: others[k] });

      },
      onPeers: function (cb) { subs.push(cb); return function () { var i = subs.indexOf(cb); if (i >= 0) subs.splice(i, 1); }; },

  /* ======================================================= transport: p2p

     layer presence on top of a broadcast action, since peer-to-peer gives us
     messages but no shared state.
     ======================================================================= */
  function makeP2P(lib, appId, roomName) {
    var room = lib.joinRoom({ appId: appId }, roomName);
    var act = room.makeAction('pr');
    var myId = lib.selfId, mine = {}, others = {}, subs = [];

    function fire() { for (var i = 0; i < subs.length; i++) try { subs[i](); } catch (e) { } }

    room.onPeerLeave = function (id) { delete others[id]; fire(); };

    var keep = setInterval(blast, 1000);                       // survive dropped joins

    return {
      kind: 'p2p',
      setPresence: function (o) {
        for (var k in o) { if (o[k] === null) delete mine[k]; else mine[k] = o[k]; }
        blast();
        return Promise.resolve();
      },
      peers: function () {
        var out = [{ id: myId, isMe: true, sameTab: true, pr: mine }];
        for (var k in others) out.push({ id: k, isMe: false, sameTab: false, pr: others[k] });
        return out;
      },
      onPeers: function (cb) { subs.push(cb); return function () { var i = subs.indexOf(cb); if (i >= 0) subs.splice(i, 1); }; },
      connected: function () { return true; },
      join: function (name) { return Promise.resolve(makeP2P(lib, appId, name)); },

    function fire() { for (var i = 0; i < subs.length; i++) try { subs[i](); } catch (e) { } }

      kind: 'local',
      setPresence: function (o) {
        for (var k in o) { if (o[k] === null) delete mine[k]; else mine[k] = o[k]; }
        if (performance.now() - lastSend > 32) post();
        return Promise.resolve();
      },
      peers: function () {
        var out = [{ id: id, isMe: true, sameTab: true, pr: mine }];
        for (var k in others) out.push({ id: k, isMe: false, sameTab: false, pr: others[k].pr });
        return out;
      },
      onPeers: function (cb) { subs.push(cb); return function () { var i = subs.indexOf(cb); if (i >= 0) subs.splice(i, 1); }; },

      join: function (name) { return Promise.resolve(makeLocal('rr-room-' + name)); },

      Math.round(f.hp * 10), Math.round(f.stam), Math.round(f.meter), Math.round(f.stun),

    oppReady: false,
    myHero: 0,

    note: '',

    //    rung in practice — the relay is either up for all of us or for none.
    (function () {
